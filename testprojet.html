<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Emoji Match Game</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.js"></script>
</head>
<body>
<script>
class Boot extends Phaser.Scene {
    constructor() { super('Boot'); }
    create() { this.registry.set('highscore', 0); this.scene.start('Preloader'); }
}

class Preloader extends Phaser.Scene {
    constructor() { super('Preloader'); }
    preload() {
        this.loadText = this.add.text(400, 300, 'Loading ...', { font: '48px Arial', color: '#ffffff' }).setOrigin(0.5);
        this.load.audio('music', 'https://freesound.org/data/previews/522/522180_8284181-lq.mp3');
        this.load.audio('match', 'https://freesound.org/data/previews/331/331912_3248244-lq.mp3');
        // Pas d'images, on utilise des emojis
    }
    create() {
        if(this.sound.locked){
            this.loadText.setText('Click to Start');
            this.input.once('pointerdown',()=>this.scene.start('MainMenu'));
        } else {
            this.scene.start('MainMenu');
        }
    }
}

class MainMenu extends Phaser.Scene {
    constructor(){ super('MainMenu'); }
    create(){
        let bg = this.add.rectangle(400,300,800,600,0x008eb0);
        this.add.text(400,200,'Emoji Match',{font:'60px Arial',color:'#ffffff'}).setOrigin(0.5);
        let btn = this.add.text(400,400,'Start',{font:'40px Arial',backgroundColor:'#ffcc00',color:'#333',padding:{x:20,y:10}}).setOrigin(0.5)
            .setInteractive({useHandCursor:true})
            .on('pointerdown',()=>this.scene.start('MainGame'));
        // Musique
        if(!this.music){ this.music = this.sound.add('music',{loop:true,volume:0.3}); this.music.play(); }
    }
}

class MainGame extends Phaser.Scene {
    constructor(){ super('MainGame'); }
    create(){
        this.add.rectangle(400,300,800,600,0x008eb0);
        this.score = 0;
        this.highscore = this.registry.get('highscore');
        this.scoreText = this.add.text(530,20,'Found: 0',{font:'32px Arial',color:'#ffffff'});
        this.timerText = this.add.text(20,20,'30:00',{font:'32px Arial',color:'#ffffff'});

        this.timeLeft = 30;

        this.emojis = ['😀','😂','😍','🥰','😎','🤩','🤪','😇','😜','🤓','🧐','😱','😴','🤤','😈','👻'];
        Phaser.Utils.Array.Shuffle(this.emojis);

        this.cards = [];
        let positions = [];
        for(let r=0;r<4;r++){
            for(let c=0;c<4;c++){
                positions.push({x:200+c*100,y:150+r*100});
            }
        }
        Phaser.Utils.Array.Shuffle(positions);

        this.selected=null;
        this.matchedPairs=0;

        for(let i=0;i<16;i++){
            let pos = positions[i];
            let card = this.add.text(pos.x,pos.y,'❓',{font:'64px Arial',color:'#ffffff'}).setOrigin(0.5).setInteractive();
            card.emoji=this.emojis[i];
            card.revealed=false;
            card.on('pointerdown',()=>this.revealCard(card));
            this.cards.push(card);
        }

        this.timerEvent = this.time.addEvent({ delay:1000, loop:true, callback:()=>{
            this.timeLeft--;
            let sec = this.timeLeft;
            let ms = "00";
            this.timerText.setText(`${sec.toString().padStart(2,'0')}:${ms}`);
            if(this.timeLeft<=0) this.timeUp();
        }});
    }

    revealCard(card){
        if(card.revealed) return;
        card.setText(card.emoji);
        card.revealed=true;

        if(!this.selected){
            this.selected=card;
        }else{
            if(this.selected.emoji===card.emoji){
                this.score++;
                this.scoreText.setText(`Found: ${this.score}`);
                this.sound.play('match');
                this.selected=null;
                this.matchedPairs++;
                if(this.matchedPairs===8){ this.showWin(); }
            }else{
                let prev=this.selected;
                this.selected=null;
                this.time.delayedCall(800,()=>{
                    card.setText('❓'); card.revealed=false;
                    prev.setText('❓'); prev.revealed=false;
                });
            }
        }
    }

    timeUp(){
        this.add.text(400,300,"Time's Up!",{font:'50px Arial',color:'#ff0000'}).setOrigin(0.5);
        this.cards.forEach(c=>c.disableInteractive());
        this.add.text(400,400,"Restart",{font:'40px Arial',backgroundColor:'#00ccff',color:'#333',padding:{x:20,y:10}}).setOrigin(0.5).setInteractive()
            .on('pointerdown',()=>this.scene.start('MainMenu'));
    }

    showWin(){
        this.add.text(400,300,"🎉 Vous avez gagné! 🎉",{font:'50px Arial',color:'#33aa33'}).setOrigin(0.5);
        this.add.text(400,400,"Restart",{font:'40px Arial',backgroundColor:'#00ccff',color:'#333',padding:{x:20,y:10}}).setOrigin(0.5).setInteractive()
            .on('pointerdown',()=>this.scene.start('MainMenu'));
    }
}

const config={type:Phaser.AUTO,width:800,height:600,scene:[Boot,Preloader,MainMenu,MainGame]};
new Phaser.Game(config);
</script>
</body>
</html>
