<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>🎮 Emoji Match 🎮</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.min.js"></script>
<style>
  body {
    margin: 0;
    background: #f0f8ff;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
  }
  canvas { border: 2px solid #000; }
</style>
</head>
<body>

<script>
// -------------------------
// THEMES
// -------------------------
const THEMES = {
  emoji: ['😀','😎','😍','😂','🥰','😜','🤩','😇','😱','🤪','🤓','🤑','🥳','😏','🤠','🤖'],
  animals: ['🐶','🐱','🦁','🐯','🐭','🐹','🐰','🐻','🐼','🐨','🐸','🐵','🐔','🦊','🐴','🦄'],
  fruits: ['🍎','🍌','🍇','🍉','🍓','🍒','🍑','🍍','🥝','🥥','🍐','🍊','🥕','🍅','🥦','🌽'],
  sport: ['⚽','🏀','🏈','⚾','🎾','🏓','🏒','🥊','🎱','🤿','🥋','⛷️','🏄','🚴','⛳','🥅']
};

let selectedTheme = "emoji";
let nightMode = false;

// -------------------------
// NIVEAUX
// -------------------------
const levels = [
  { time: 60, pairs: 8 },
  { time: 90, pairs: 12 },
  { time: 120, pairs: 15 }
];

// -------------------------
// BOUTONS
// -------------------------
function createButton(scene, x, y, text, color, bgColor, callback, fontSize='28px'){
  const container = scene.add.container(x, y);
  const rect = scene.add.rectangle(0,0,250,60,bgColor,0.8).setStrokeStyle(3,0xFFFFFF);
  const btnText = scene.add.text(0,0,text,{
    fontSize:fontSize,
    fontStyle:'bold',
    color:color
  }).setOrigin(0.5);

  container.add([rect,btnText]);
  container.setSize(rect.width, rect.height);
  container.setInteractive({useHandCursor:true})
    .on('pointerdown', callback)
    .on('pointerover', ()=>scene.tweens.add({
      targets:container,
      scale:1.05,
      duration:150,
      yoyo:true
    }));

  return container;
}

// -------------------------
// PRELOAD
// -------------------------
class PreloadScene extends Phaser.Scene {
  constructor(){ super('PreloadScene'); }
  preload(){
    this.load.audio('click','https://actions.google.com/sounds/v1/cartoon/wood_plank_flicks.ogg');
    this.load.audio('match','https://actions.google.com/sounds/v1/cartoon/pop.ogg');
    this.load.audio('nomatch','https://actions.google.com/sounds/v1/cartoon/boing.ogg');
    this.load.audio('bgMusic','https://wafa258.github.io/cv/xmas.mp3');
  }
  create(){ this.scene.start('MainMenu'); }
}

// -------------------------
// MENU
// -------------------------
class MainMenu extends Phaser.Scene {
  constructor(){ super('MainMenu'); }
  create(){
    this.add.rectangle(450,300,900,600,0xE800F0);
    this.add.text(450,100,'🎮 Emoji Match 🎮',{fontSize:'36px',color:'#FFF',fontStyle:'bold'}).setOrigin(0.5);

    const selectTheme = (theme, btn)=>{
      selectedTheme = theme;
      this.sound.play('click');
      this.themeButtons.forEach(b => b.getAt(0).setFillStyle(0xF2509B));
      btn.getAt(0).setFillStyle(0xFF99CC);
    };

    this.themeButtons=[];
    let b1=createButton(this,250,230,'Emoji 😎','#FFF',0xF2509B,()=>selectTheme('emoji',b1));
    let b2=createButton(this,650,230,'Animaux 🐶','#FFF',0xF2509B,()=>selectTheme('animals',b2));
    let b3=createButton(this,250,320,'Fruits 🍎','#FFF',0xF2509B,()=>selectTheme('fruits',b3));
    let b4=createButton(this,650,320,'Sport ⚽','#FFF',0xF2509B,()=>selectTheme('sport',b4));

    this.themeButtons.push(b1,b2,b3,b4);
    selectTheme('emoji',b1);

    createButton(this,450,450,'Start Level 1','#FFF',0xF2509B,()=>{
      this.sound.play('click');
      this.scene.start('MainGame',{level:1,theme:selectedTheme});
    });
  }
}

// -------------------------
// TRANSITION NIVEAU
// -------------------------
class LevelTransition extends Phaser.Scene {
  constructor(){ super('LevelTransition'); }
  init(data){ this.nextLevel=data.level; }
  create(){
    this.add.rectangle(450,300,900,600,0xEA5EF2);
    this.add.text(450,200,'Félicitations 🥳',{fontSize:'44px',color:'#FF4500',fontStyle:'bold'}).setOrigin(0.5);
    createButton(this,450,320,'Level '+this.nextLevel,'#FFF',0xFF6347,()=>{
      this.sound.play('click');
      this.scene.start('MainGame',{level:this.nextLevel,theme:selectedTheme});
    });
  }
}

// -------------------------
// JEU PRINCIPAL
// -------------------------
class MainGame extends Phaser.Scene {
  constructor(){ super('MainGame'); }
  init(data){
    this.level=data.level;
    this.theme=data.theme;
  }

  create(){
    this.add.rectangle(450,300,900,600,0xDDB8F2);
    this.timeLeft=levels[this.level-1].time;
    this.pairs=levels[this.level-1].pairs;
    this.score=0;
    this.matched=0;
    this.selected=null;

    this.timerText=this.add.text(20,20,'⏳ '+this.timeLeft,{fontSize:'32px',color:'#333'});
    this.scoreText=this.add.text(700,20,'Found: 0',{fontSize:'32px',color:'#333'});

    let emojis=[];
    for(let i=0;i<this.pairs;i++){
      emojis.push(THEMES[this.theme][i]);
      emojis.push(THEMES[this.theme][i]);
    }
    Phaser.Utils.Array.Shuffle(emojis);

    this.cards=[];
    let cols=4;
    let startX=250;
    let startY=150;

    emojis.forEach((e,i)=>{
      let card=this.add.text(
        startX+(i%cols)*120,
        startY+Math.floor(i/cols)*120,
        '❓',
        {fontSize:'64px'}
      ).setInteractive().setOrigin(0.5);

      card.emoji=e;
      card.revealed=false;
      card.on('pointerdown',()=>this.flipCard(card));
      this.cards.push(card);
    });

    this.timer=this.time.addEvent({
      delay:1000,
      loop:true,
      callback:()=>{
        this.timeLeft--;
        this.timerText.setText('⏳ '+this.timeLeft);
        if(this.timeLeft<=0) this.endGame();
      }
    });
  }

  flipCard(card){
    if(card.revealed || this.selected===card) return;

    card.setText(card.emoji);
    card.revealed=true;

    if(!this.selected){
      this.selected=card;
      return;
    }

    const first=this.selected;
    this.selected=null;

    // MATCH
    if(first.emoji===card.emoji){
      this.sound.play('match');
      this.score++;
      this.matched++;
      this.scoreText.setText('Found: '+this.score);
      if(this.matched===this.cards.length/2) this.endLevel();
    }
    // NO MATCH
    else{
      this.sound.play('nomatch');
      this.time.delayedCall(700,()=>{
        first.setText('❓'); first.revealed=false;
        card.setText('❓'); card.revealed=false;
      });
    }
  }

  endLevel(){
    this.timer.remove();
    this.scene.start('LevelTransition',{level:this.level+1});
  }

  endGame(){
    this.timer.remove();
    this.add.rectangle(450,300,900,600,0x000000,0.5);
    createButton(this,450,300,'Restart','#FFF',0xFF6347,()=>{
      this.scene.start('MainMenu');
    });
  }
}

// -------------------------
new Phaser.Game({
  type:Phaser.AUTO,
  width:900,
  height:600,
  scene:[PreloadScene,MainMenu,LevelTransition,MainGame]
});
</script>

</body>
</html>
