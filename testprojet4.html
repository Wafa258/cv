<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>🎮 Emoji Match 🎮</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.min.js"></script>
<style>
  body { margin: 0; background: #f0f8ff; display:flex; justify-content:center; align-items:center; height:100vh;}
  canvas { border: 2px solid #000; }
</style>
</head>
<body>

<script>
const levels = [
  { time: 60, pairs: 8 },
  { time: 90, pairs: 12 },
  { time: 120, pairs: 15 }
];

// Fonction pour créer un bouton simple (texte interactif)
function createTextButton(scene, x, y, text, color, callback){
  const btnText = scene.add.text(x, y, text, { fontSize:'28px', fontStyle:'bold', color:color }).setOrigin(0.5).setInteractive({useHandCursor:true});
  btnText.on('pointerdown', callback);
  btnText.on('pointerover',()=>btnText.setColor('#FFFF00'));
  btnText.on('pointerout',()=>btnText.setColor(color));
  return btnText;
}

// Préchargement
class PreloadScene extends Phaser.Scene {
  constructor(){ super('PreloadScene'); }
  preload(){
    this.load.audio('click','https://actions.google.com/sounds/v1/cartoon/wood_plank_flicks.ogg');
    this.load.audio('match','https://actions.google.com/sounds/v1/cartoon/pop.ogg');
    this.load.audio('bgMusic','https://wafa258.github.io/cv/xmas.mp3');
  }
  create(){ this.scene.start('MainMenu'); }
}

// Menu principal
class MainMenu extends Phaser.Scene {
  constructor(){ super('MainMenu'); }
  create(){
    this.add.rectangle(400,275,800,550,0xE800F0);
    this.add.text(400,120,'🎮 Emoji Match 🎮',{fontSize:'36px',color:'#FFF',fontStyle:'bold'}).setOrigin(0.5);
    createTextButton(this,400,350,'Start Level 1','#FFFFFF',()=>{ 
      this.sound.play('click'); 
      this.scene.start('MainGame',{level:1}); 
    });
  }
}

// Transition de niveau
class LevelTransition extends Phaser.Scene {
  constructor(){ super('LevelTransition'); }
  init(data){ this.nextLevel = data.level || 2; }
  create(){
    this.add.rectangle(400,275,800,550,0xEA5EF2);
    this.add.text(400,180,'Félicitations🥳',{fontSize:'44px',color:'#FF4500',fontStyle:'bold'}).setOrigin(0.5);
    this.add.text(400,240,'Jouez au niveau '+this.nextLevel+' !',{fontSize:'28px',color:'#000',fontStyle:'bold'}).setOrigin(0.5);
    createTextButton(this,400,330,'Level '+this.nextLevel,'#FFFFFF',()=>{ 
      this.sound.play('click'); 
      this.scene.start('MainGame',{level:this.nextLevel}); 
    });
  }
}

// Jeu principal
class MainGame extends Phaser.Scene {
  constructor(){ super('MainGame'); }
  init(data){ this.level = data.level || 1; }

  create(){
    this.add.rectangle(400,275,800,550,0xDDB8F2);
    const levelData = levels[this.level-1] || levels[0];
    this.timeLeft = levelData.time;
    this.pairs = levelData.pairs;
    this.score = 0;
    this.matched = 0;
    this.selected = null;

    // Timer et score
    this.timerText = this.add.text(20,20,'⏳ Time: '+this.timeLeft,{fontSize:'20px',color:'#333',fontStyle:'bold'});
    this.scoreText = this.add.text(600,20,'Found: '+this.score,{fontSize:'20px',color:'#333',fontStyle:'bold'});

    // Musique
    const musicIcon = this.add.text(730,20,'🔊',{fontSize:'22px',color:'#333'}).setInteractive();
    musicIcon.on('pointerdown',()=>{
      this.sound.unlock();
      if(!this.game.bgMusic){
        this.game.bgMusic=this.sound.add('bgMusic',{loop:true,volume:0.4});
        this.game.bgMusic.play();
      }else{
        this.game.bgMusic.isPlaying?this.game.bgMusic.pause():this.game.bgMusic.resume();
      }
    });

    // Pause bouton
    this.pauseText = this.add.text(730,60,'⏸️',{fontSize:'22px',color:'#F2509B'}).setOrigin(0.5).setInteractive();
    this.pauseText.on('pointerdown',()=>{
      this.scene.pause();
      this.scene.launch('PauseScene',{parent:this});
    });
    this.pauseText.on('pointerover',()=>this.pauseText.setColor('#FF85C1'));
    this.pauseText.on('pointerout',()=>this.pauseText.setColor('#F2509B'));

    // Préparer les cartes
    this.emojis=['😀','😎','😍','😂','🥰','😜','🤩','😇','😱','🤪','🤓','🤑','🥳','😏','🤠','🤖'];
    let cardEmojis=[];
    for(let i=0;i<this.pairs;i++) cardEmojis.push(this.emojis[i%this.emojis.length],this.emojis[i%this.emojis.length]);
    Phaser.Utils.Array.Shuffle(cardEmojis);

    this.cards=[];
    const cols = Math.ceil(Math.sqrt(this.pairs*2));
    const rows = Math.ceil((this.pairs*2)/cols);
    const spacingX = 700/cols;
    const spacingY = 400/rows;
    const offsetX = 50 + spacingX/2;
    const offsetY = 100 + spacingY/2;

    for(let i=0;i<cardEmojis.length;i++){
      const row=Math.floor(i/cols);
      const col=i%cols;
      const card=this.add.text(offsetX+col*spacingX,offsetY+row*spacingY,'❓',{fontSize:'64px',fontFamily:'Arial'}).setOrigin(0.5).setInteractive();
      card.emoji=cardEmojis[i]; card.revealed=false;
      card.on('pointerdown',()=>this.revealCard(card));
      this.cards.push(card);
    }

    // Timer
    this.timerEvent=this.time.addEvent({delay:1000,loop:true,callback:()=>{
      this.timeLeft--;
      this.timerText.setText('⏳ Time: '+this.timeLeft);
      if(this.timeLeft<=0) this.endGame();
    }});
  }

  revealCard(card){
    if(card.revealed||this.selected===card) return;
    card.setText(card.emoji);
    card.revealed=true;

    if(!this.selected){ this.selected=card; }
    else{
      if(this.selected.emoji===card.emoji){
        this.sound.play('click');
        this.tweens.add({targets:[this.selected,card],scale:{from:1,to:1.3},duration:150,yoyo:true,ease:'Back'});
        this.selected=null;
        this.matched++; this.score++; this.scoreText.setText('Found: '+this.score);
        if(this.matched===this.cards.length/2) this.endLevel();
      }else{
        const first=this.selected; this.selected=null;
        this.time.delayedCall(500,()=>{
          first.setText('❓'); first.revealed=false;
          card.setText('❓'); card.revealed=false;
        });
        this.sound.play('match');
      }
    }
  }

  endLevel(){
    this.cards.forEach(c=>this.tweens.add({targets:c,alpha:0,duration:500}));
    this.time.delayedCall(600,()=>{
      if(this.level<levels.length) this.scene.start('LevelTransition',{level:this.level+1});
      else this.endGame(true);
    });
  }

  endGame(win=false){
    this.timerEvent.remove();
    this.add.rectangle(400,275,800,550,0x000000,0.5);
    this.add.text(400,180,win?'Level Complete!':'Time Over!',{fontSize:'44px',color:'#FFF',fontStyle:'bold'}).setOrigin(0.5);
    createTextButton(this,400,280,'Restart','#FFFFFF',()=>{ 
      this.sound.play('click'); 
      this.scene.start('MainMenu'); 
    });
  }
}

// Pause
class PauseScene extends Phaser.Scene{
  constructor(){ super('PauseScene'); }
  init(data){ this.parent=data.parent; }
  create(){
    this.add.rectangle(400,275,800,550,0x000000,0.5);
    this.add.text(400,180,'Paused',{fontSize:'44px',color:'#FFF',fontStyle:'bold'}).setOrigin(0.5);
    // Resume en bas, sans fond
    createTextButton(this,400,500,'▶ Resume','#F2509B',()=>{this.scene.stop(); this.parent.scene.resume();});
  }
}

// Config
const config={
  type: Phaser.AUTO,
  width:800,
  height:550,
  scene:[PreloadScene,MainMenu,LevelTransition,MainGame,PauseScene]
};

new Phaser.Game(config);
</script>

</body>
</html>
