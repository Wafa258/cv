<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>🎮 Emoji Match Futuriste 🎮</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.min.js"></script>
<style>
  body { margin: 0; background: #C36EFF; display:flex; justify-content:center; align-items:center; height:100vh; }
  canvas { border: 2px solid #000; }
</style>
</head>
<body>

<script>
let selectedTheme = "emoji"; // thème par défaut

// --- LES THÈMES EN ÉMOJIS ---
const THEMES = {
  emoji: ['😀','😎','😍','😂','🥰','😜','🤩','😇','😱','🤪','🤓','🤑','🥳','😏','🤠','🤖'],

  animals: ['🐶','🐱','🦁','🐯','🐭','🐹','🐰','🐻','🐼','🐨','🐸','🐵','🐧','🐦','🐤','🦊'],

  fruits: ['🍎','🍌','🍇','🍉','🍓','🍒','🍑','🍍','🥝','🥥','🍅','🥕','🥦','🌽','🍆','🍐'],

  sport: ['⚽','🏀','🏈','⚾','🎾','🏓','🏒','🥊','🎱','🤿','🥋','⛷️','🏄','🚴','⛳','🥅']
};

const levels = [
  { time: 60, pairs: 8 },
  { time: 90, pairs: 12 },
  { time: 120, pairs: 15 }
];

// --- CREATION DES BOUTONS ---
function createButton(scene, x, y, text, callback){
  const bg = scene.add.rectangle(x,y,260,70,0xF8D6FF).setStrokeStyle(4,0xFFFFFF);
  const txt = scene.add.text(x,y,text,{fontSize:'26px',fontStyle:'bold',color:'#000'}).setOrigin(0.5);

  bg.setInteractive({useHandCursor:true})
    .on('pointerdown', callback)
    .on('pointerover',()=> bg.setFillStyle(0xFFD8FB))
    .on('pointerout',()=> bg.setFillStyle(0xF8D6FF));

  return {bg,txt};
}

// --- PRELOAD ---
class PreloadScene extends Phaser.Scene {
  constructor(){ super('PreloadScene'); }
  preload(){
    this.load.audio('click','https://actions.google.com/sounds/v1/cartoon/wood_plank_flicks.ogg');
    this.load.audio('match','https://actions.google.com/sounds/v1/cartoon/pop.ogg');
  }
  create(){ this.scene.start('MainMenu'); }
}

// --- MENU PRINCIPAL ---
class MainMenu extends Phaser.Scene {
  constructor(){ super('MainMenu'); }

  create(){
    this.add.rectangle(450,300,900,600,0xC36EFF);

    this.add.text(450,90,'🎮 Emoji Match Futuriste 🎮',
      {fontSize:'40px',color:'#FFF',fontStyle:'bold'}).setOrigin(0.5);

    this.add.text(450,150,'Choisis un thème :',
      {fontSize:'28px',color:'#FFF'}).setOrigin(0.5);

    // THÈMES (2 rangées)
    const themes = [
      {name:'emoji', label:'Emoji 😎'},
      {name:'animals', label:'Animaux 🐶'},
      {name:'fruits', label:'Fruits 🍎'},
      {name:'sport', label:'Sport ⚽'}
    ];

    let y = 230;
    let x1 = 300, x2 = 600;

    for(let i=0;i<themes.length;i++){
      const tx = (i%2===0)?x1:x2;
      if(i===2) y += 90;

      createButton(this, tx, y, themes[i].label, ()=>{
        selectedTheme = themes[i].name;
        this.sound.play('click');
      });
    }

    // BOUTON START LEVEL 1
    createButton(this, 450, 450, '▶ Start Level 1', ()=>{
      this.sound.play('click');
      this.scene.start('MainGame',{level:1, theme:selectedTheme});
    });
  }
}

// --- SCÈNE DU JEU ---
class MainGame extends Phaser.Scene {
  constructor(){ super('MainGame'); }
  init(data){ 
    this.level=data.level; 
    this.theme=data.theme;
  }

  create(){
    this.add.rectangle(450,300,900,600,0xC36EFF);

    const levelData = levels[this.level-1];
    this.timeLeft = levelData.time;
    this.pairs = levelData.pairs;

    this.score = 0;
    this.matched = 0;
    this.selected = null;

    this.timerText = this.add.text(20,20,'⏳ '+this.timeLeft,{fontSize:'36px',color:'#FFF'});
    this.scoreText = this.add.text(650,20,'Trouvés: 0',{fontSize:'36px',color:'#FFF'});

    // --- CREATION DES CARTES ---
    let cardsList = [];
    const themeSet = THEMES[this.theme];

    for(let i=0;i<this.pairs;i++){
      cardsList.push(themeSet[i%themeSet.length], themeSet[i%themeSet.length]);
    }

    Phaser.Utils.Array.Shuffle(cardsList);

    this.cards = [];
    const cols = 4;
    const startX = 200, startY = 150;
    const spacing = 120;

    for(let i=0;i<cardsList.length;i++){
      const row = Math.floor(i/cols);
      const col = i%cols;
      const x = startX + col*spacing;
      const y = startY + row*spacing;

      const card = this.add.text(x,y,'❓',{fontSize:'64px',color:'#FFF'})
        .setOrigin(0.5).setInteractive();

      card.value = cardsList[i];
      card.revealed = false;

      card.on('pointerdown',()=> this.revealCard(card));

      this.cards.push(card);
    }

    // TIMER
    this.timerEvent = this.time.addEvent({
      delay:1000, loop:true, callback:()=>{
        this.timeLeft--;
        this.timerText.setText('⏳ '+this.timeLeft);
        if(this.timeLeft<=0) this.endGame(false);
    }});
  }

  revealCard(card){
    if(card.revealed || this.selected===card) return;

    card.setText(card.value);
    card.revealed = true;

    if(!this.selected){
      this.selected = card;
    } else {
      if(this.selected.value === card.value){
        this.sound.play('match');
        this.score++;
        this.scoreText.setText("Trouvés: "+this.score);
        this.matched++;
        this.selected = null;

        if(this.matched === this.pairs){
          this.endGame(true);
        }

      } else {
        const first = this.selected;
        this.selected = null;

        this.time.delayedCall(500,()=>{
          first.setText('❓'); first.revealed = false;
          card.setText('❓');  card.revealed = false;
        });
      }
    }
  }

  endGame(win){
    this.timerEvent.remove();

    this.add.rectangle(450,300,900,600,0x000000,0.5);
    this.add.text(450,220, win?'🎉 Bravo !':'⏳ Temps écoulé !',
      {fontSize:'48px',color:'#FFF'}).setOrigin(0.5);

    createButton(this,450,330,'Retour Menu',()=>{
      this.scene.start('MainMenu');
    });
  }
}

const config = {
  type: Phaser.AUTO,
  width: 900,
  height: 600,
  scene: [PreloadScene, MainMenu, MainGame]
};

new Phaser.Game(config);
</script>

</body>
</html>
