<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>🎮 Emoji Match 🎮</title>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.min.js"></script>
  <style>
    body {
      margin: 0;
      background: #1e1e1e;
    }
    canvas {
      display: block;
      margin: 30px auto;
      border: 2px solid #000;
    }
  </style>
</head>
<body>

<script>
class MainMenu extends Phaser.Scene {
  constructor() { super('MainMenu'); }

  preload() {}

  create() {
    this.add.rectangle(400,300,800,600,0x2a0a24);
    this.add.text(400, 150, '🎮 Emoji Match 🎮', { fontSize: '40px', color: '#EEE', fontStyle: 'bold' }).setOrigin(0.5);

    const btn = this.add.rectangle(400, 400, 300, 70, 0x552222).setInteractive({ useHandCursor: true });
    this.add.text(400, 400, 'Start Level 1', { fontSize: '32px', color: '#EEE', fontStyle: 'bold' }).setOrigin(0.5);

    btn.on('pointerover', () => btn.setFillStyle(0x663333));
    btn.on('pointerout', () => btn.setFillStyle(0x552222));

    btn.on('pointerdown', () => {
      this.scene.start('MainGame', { level: 1 });
    });
  }
}

class LevelTransition extends Phaser.Scene {
  constructor(){ super('LevelTransition'); }
  init(data) { this.nextLevel = data.level || 2; }

  preload(){}

  create(){
    this.add.rectangle(400,300,800,600,0x333300);
    this.add.text(400,250,'Félicitations !', { fontSize:'48px', color:'#FFDD55', fontStyle:'bold' }).setOrigin(0.5);
    this.add.text(400,320,'Jouez au niveau '+this.nextLevel+' !', { fontSize:'32px', color:'#EEE', fontStyle:'bold' }).setOrigin(0.5);

    const btn = this.add.rectangle(400,400,300,70,0x552222).setInteractive({ useHandCursor: true });
    this.add.text(400,400,'Level '+this.nextLevel, { fontSize:'32px', color:'#EEE', fontStyle:'bold' }).setOrigin(0.5);

    btn.on('pointerover', () => btn.setFillStyle(0x663333));
    btn.on('pointerout', () => btn.setFillStyle(0x552222));

    btn.on('pointerdown', () => this.scene.start('MainGame', { level: this.nextLevel }));
  }
}

class MainGame extends Phaser.Scene {
  constructor(){ super('MainGame'); }
  init(data){ this.level = data.level || 1; }

  preload(){}

  create(){
    this.add.rectangle(400,300,800,600,0x1e1e1e);

    this.score = 0;
    this.timeLeft = this.level === 1 ? 60 : 90;
    this.pairs = this.level === 1 ? 8 : 12;

    this.timerText = this.add.text(20, 20, 'Time: ' + this.timeLeft, {
      fontSize: '32px', color: '#EEE', fontStyle: 'bold'
    });
    this.scoreText = this.add.text(550, 20, 'Found: ' + this.score, {
      fontSize: '32px', color: '#EEE', fontStyle: 'bold'
    });

    this.emojis = ['😀','😎','😍','😂','🥰','😜','🤩','😇','😱','🤪','🤓','🤑','🥳','😏','🤠','🤖'];

    let cardEmojis = [];
    for (let i = 0; i < this.pairs; i++) {
      cardEmojis.push(this.emojis[i]);
      cardEmojis.push(this.emojis[i]);
    }
    Phaser.Utils.Array.Shuffle(cardEmojis);

    this.cards = [];
    this.selected = null;
    this.matched = 0;

    const cols = 4, startX = 250, startY = 100, spacingX = 100, spacingY = 100;

    for (let i = 0; i < cardEmojis.length; i++) {
      const row = Math.floor(i / cols), col = i % cols;

      // Carte
      const card = this.add.text(
        startX + col * spacingX,
        startY + row * spacingY + 5,
        '❓',
        {
          fontSize: '120px', // taille beaucoup trop grande
          fontFamily: 'Arial',
          color: "#EEE"
        }
      ).setOrigin(0.5).setInteractive();

      // → L'emoji est trop grand = son haut est naturellement hors écran
      //   pas de scale, pas de masque, positions intactes

      card.emoji = cardEmojis[i];
      card.revealed = false;

      card.on('pointerdown', () => this.revealCard(card));
      this.cards.push(card);
    }

    this.timerEvent = this.time.addEvent({
      delay: 1000,
      loop: true,
      callback: () => {
        this.timeLeft--;
        this.timerText.setText('Time: ' + this.timeLeft);
        if (this.timeLeft <= 0) this.endGame();
      }
    });
  }

  revealCard(card){
    if (card.revealed || this.selected === card) return;

    card.setText(card.emoji);
    card.setFontSize(120); // toujours trop grand

    if (!this.selected) {
      this.selected = card;
    } else {
      if (this.selected.emoji === card.emoji) {

        this.selected = null;
        this.score++;
        this.matched++;
        this.scoreText.setText('Found: ' + this.score);

        if (this.matched === this.cards.length / 2) {
          if (this.level === 1) this.scene.start('LevelTransition', { level: 2 });
          else this.endGame(true);
        }

      } else {
        const first = this.selected;
        this.selected = null;

        this.time.delayedCall(800, () => {
          first.setText('❓');
          first.setFontSize(120);
          card.setText('❓');
          card.setFontSize(120);
        });
      }
    }
  }

  endGame(win = false) {
    this.timerEvent.remove();
    this.add.rectangle(400,300,800,600,0x000000,0.6);
    this.add.text(400,250, win ? 'Level Complete!' : 'Time Over!', {
      fontSize: '48px', color: '#FFF', fontStyle: 'bold'
    }).setOrigin(0.5);

    const btnBg = this.add.rectangle(400,350,300,70,0x552222)
      .setInteractive({ useHandCursor: true });
    this.add.text(400,350,'Restart', {
      fontSize: '32px', color: '#EEE', fontStyle: 'bold'
    }).setOrigin(0.5);

    btnBg.on('pointerover', ()=> btnBg.setFillStyle(0x663333));
    btnBg.on('pointerout', ()=> btnBg.setFillStyle(0x552222));
    btnBg.on('pointerdown', () => this.scene.start('MainMenu'));
  }
}

const config = {
  type: Phaser.AUTO,
  width: 800,
  height: 600,
  scene: [MainMenu, LevelTransition, MainGame]
};

new Phaser.Game(config);
</script>

</body>
</html>
