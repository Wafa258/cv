<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Emoji Match Game</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.min.js"></script>
<style>
body {
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #ffd54f, #ff8a65, #4fc3f7, #81c784);
    height: 100vh;
}
#game-container {
    width: 800px;
    height: 600px;
}
</style>
</head>
<body>
<div id="game-container"></div>
<script>

class BootScene extends Phaser.Scene {
    constructor() { super('Boot'); }
    create() {
        this.registry.set('highscore', 0);
        this.registry.set('level', 1);
        this.scene.start('Preloader');
    }
}

class PreloaderScene extends Phaser.Scene {
    constructor() { super('Preloader'); }
    preload() {
        this.add.text(400,300,'Loading ...',{ fontSize:'48px', color:'#000'}).setOrigin(0.5);
        // Pas de sons pour l'instant
    }
    create() { this.scene.start('MainMenu'); }
}

class MainMenuScene extends Phaser.Scene {
    constructor() { super('MainMenu'); }
    create() {
        this.add.text(400,200,'Emoji Match!',{ fontSize:'64px', color:'#000', fontStyle:'bold' }).setOrigin(0.5);

        const startBtn = this.add.text(400,400,'Start Level 1',{
            fontSize:'32px',
            color:'#fff',
            backgroundColor:'#ff5722',
            padding:{x:20,y:10},
            fontStyle:'bold'
        }).setOrigin(0.5).setInteractive({useHandCursor:true});

        startBtn.on('pointerdown',()=>{ this.scene.start('GameScene',{level:1}); });
    }
}

class GameScene extends Phaser.Scene {
    constructor() { super('GameScene'); }

    init(data){ 
        this.level=data.level; 
        this.timeLimit=this.level===1?30:60; 
    }

    create() {
        // Fond simple pour le jeu
        this.add.rectangle(400,300,800,600,0xfff9c4);

        // Score et timer
        this.score=0;
        this.timerText=this.add.text(20,20,`Time: ${this.timeLimit}`,{ 
            fontSize:'40px',color:'#000',stroke:'#fff',strokeThickness:6, backgroundColor:'rgba(255,255,255,0.5)', padding:{x:10,y:5} 
        });
        this.scoreText=this.add.text(550,20,`Found: 0`,{ 
            fontSize:'40px',color:'#000',stroke:'#fff',strokeThickness:6, backgroundColor:'rgba(255,255,255,0.5)', padding:{x:10,y:5} 
        });

        // Création de la grille
        const emojisList=['😀','😂','😍','😎','🤩','😜','😢','😡','🥳','🤯','😇','😱','🤖','👻','💩','🎃','🐶','🐱','🦊','🐸','🐵','🦄'];
        let gridSize=4, spacing=100, startX=200, startY=150;
        let selectedPairs=Phaser.Utils.Array.Shuffle(emojisList).slice(0,gridSize*gridSize/2);
        let pairedEmojis=[...selectedPairs,...selectedPairs];
        Phaser.Utils.Array.Shuffle(pairedEmojis);

        this.emojisGroup=[];
        for(let i=0;i<gridSize;i++){
            for(let j=0;j<gridSize;j++){
                let index=i*gridSize+j;
                let emoji=this.add.text(startX+j*spacing,startY+i*spacing,pairedEmojis[index],{ fontSize:'64px' }).setOrigin(0.5).setInteractive();
                emoji.selected=false; 
                this.emojisGroup.push(emoji);
            }
        }

        this.firstSelection=null;
        this.input.on('gameobjectdown',this.selectEmoji,this);

        this.timerEvent=this.time.addEvent({ delay:this.timeLimit*1000, callback:this.timeOver, callbackScope:this });
    }

    selectEmoji(pointer,emoji){
        if(emoji.selected) return;
        emoji.setStyle({ backgroundColor:'#fff59d' });
        if(!this.firstSelection){ 
            this.firstSelection=emoji; 
        }
        else{
            if(emoji.text===this.firstSelection.text && emoji!==this.firstSelection){
                emoji.selected=true; 
                this.firstSelection.selected=true;
                this.score++; 
                this.scoreText.setText(`Found: ${this.score}`);
            } else{
                this.time.delayedCall(500,()=>{
                    emoji.setStyle({backgroundColor:null}); 
                    this.firstSelection.setStyle({backgroundColor:null}); 
                });
            }
            this.firstSelection=null;
            if(this.score===this.emojisGroup.length/2){
                if(this.level===1){ this.scene.start('GameScene',{level:2}); }
                else{ this.showRestartButton('You Win! Play Again'); }
            }
        }
    }

    timeOver(){ this.showRestartButton('Time Over! Try Again'); }

    showRestartButton(text){
        this.emojisGroup.forEach(e=>e.disableInteractive());
        const btn=this.add.text(400,500,text,{ 
            fontSize:'32px',
            color:'#fff',
            backgroundColor:'#4caf50',
            padding:{x:20,y:10},
            fontStyle:'bold'
        }).setOrigin(0.5).setInteractive({useHandCursor:true});
        btn.on('pointerdown',()=>{ this.scene.start('MainMenu'); });
    }

    update(){ 
        this.timerText.setText(`Time: ${Math.ceil(this.timerEvent.getRemainingSeconds())}`); 
    }
}

const config={
    type: Phaser.AUTO,
    width:800,
    height:600,
    parent:'game-container',
    scene:[BootScene,PreloaderScene,MainMenuScene,GameScene]
};

new Phaser.Game(config);

</script>
</body>
</html>
