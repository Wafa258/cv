<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Emoji Match</title>
<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #ffecd2, #fcb69f);
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  h1 {
    color: #333;
    margin-top: 20px;
    text-align: center;
  }
  #phaser-example {
    margin-top: 20px;
  }
</style>
</head>
<body>
<h1>🎮 Emoji Match 🎮</h1>
<div id="phaser-example"></div>

<script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.min.js"></script>
<script type="module">

// ---------------- MainMenu ----------------
class MainMenu extends Phaser.Scene {
    constructor(){ super('MainMenu'); }
    create(){
        this.cameras.main.setBackgroundColor('#ffecd2');

        this.startText = this.add.text(400,300,'Click to Start',{fontSize:'32px', color:'#333'}).setOrigin(0.5).setInteractive();
        this.startText.on('pointerdown', ()=>{
            this.scene.start('MainGame');
        });
    }
}

// ---------------- MainGame ----------------
class MainGame extends Phaser.Scene {
    constructor() {
        super('MainGame');
        this.emojis=this.selectedEmoji=null;
        this.matched=false;
        this.score=0;
        this.scoreText=this.timer=this.timerText=null;
    }

    create(){
        this.cameras.main.setBackgroundColor('#fcb69f');

        const baseEmojis=['😀','😎','🎯','🎲','🕹️','🤖','🐶','🍕','⚽','🌟'];
        let selectedEmojis=[];
        for(let i=0;i<8;i++){
            let e=Phaser.Utils.Array.RemoveRandomElement(baseEmojis.slice());
            selectedEmojis.push(e,e);
        }
        Phaser.Utils.Array.Shuffle(selectedEmojis);

        this.emojis=[];
        for(let i=0;i<16;i++){
            let x=200+(i%4)*120;
            let y=150+Math.floor(i/4)*120;
            let text=this.add.text(x,y,selectedEmojis[i],{fontSize:'64px', fontFamily:'Arial'}).setOrigin(0.5).setInteractive();
            text.emoji=selectedEmojis[i];
            text.revealed=false;
            this.emojis.push(text);
        }

        const fontStyle={fontFamily:'Arial', fontSize:32, color:'#333'};
        this.scoreText=this.add.text(600,50,'Found: 0',fontStyle);
        this.timerText=this.add.text(50,50,'30:00',fontStyle);

        this.input.on('gameobjectdown', this.selectEmoji, this);

        this.timer=this.time.addEvent({delay:30000, callback:this.gameOver, callbackScope:this});
    }

    selectEmoji(pointer, emoji){
        if(this.matched) return;
        if(!this.selectedEmoji){
            this.selectedEmoji=emoji;
            emoji.setStyle({backgroundColor:'#ffffff'});
        } else if(emoji!==this.selectedEmoji){
            if(emoji.emoji===this.selectedEmoji.emoji){
                emoji.setStyle({backgroundColor:'#00ff00'});
                this.selectedEmoji.setStyle({backgroundColor:'#00ff00'});
                this.matched=true;
                this.score++; this.scoreText.setText('Found: '+this.score);
                this.time.delayedCall(600, ()=>{
                    emoji.setStyle({backgroundColor:null});
                    this.selectedEmoji.setStyle({backgroundColor:null});
                    this.matched=false; this.selectedEmoji=null;
                });
            } else {
                this.selectedEmoji.setStyle({backgroundColor:null});
                this.selectedEmoji=emoji;
                emoji.setStyle({backgroundColor:'#ffffff'});
            }
        }
    }

    update(){
        if(this.timer){
            const remaining=(30-this.timer.getElapsedSeconds()).toFixed(0);
            let seconds = remaining.padStart(2,'0');
            this.timerText.setText(seconds+':00');
        }
    }

    gameOver(){
        this.input.off('gameobjectdown',this.selectEmoji,this);
        this.input.once('pointerdown',()=>{ this.scene.start('MainMenu'); });
    }
}

// ---------------- Main ----------------
const config = {
    type: Phaser.AUTO,
    width: 800,
    height: 600,
    parent: 'phaser-example',
    scene:[MainMenu, MainGame]
};
new Phaser.Game(config);

</script>
</body>
</html>
