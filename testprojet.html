<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Emoji Match</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.min.js"></script>
<style>
    body { margin: 0; background: #f0f8ff; display: flex; justify-content: center; align-items: center; height: 100vh; }
    canvas { border: 2px solid #000; }
</style>
</head>
<body>

<script>
// --- SCENES ---
class MainMenu extends Phaser.Scene {
    constructor() { super('MainMenu'); }
    preload() { this.load.audio('click', 'https://actions.google.com/sounds/v1/cartoon/wood_plank_flicks.ogg'); }
    create() {
        this.add.rectangle(400,300,800,600,0x87CEFA); // fond bleu ciel
        this.add.text(400,150,'Emoji Match',{fontSize:'64px', color:'#FF4500', fontStyle:'bold'}).setOrigin(0.5);

        // Bouton start
        const btn = this.add.rectangle(400,400,300,70,0xFF6347).setInteractive({useHandCursor:true});
        const txt = this.add.text(400,400,'Start Level 1',{fontSize:'32px',color:'#FFF',fontStyle:'bold'}).setOrigin(0.5);

        btn.on('pointerover',()=>btn.setFillStyle(0xFF4500));
        btn.on('pointerout',()=>btn.setFillStyle(0xFF6347));
        btn.on('pointerdown', ()=>{
            this.sound.play('click');
            this.scene.start('MainGame',{level:1});
        });
    }
}

class MainGame extends Phaser.Scene {
    constructor() { super('MainGame'); }
    init(data){ this.level = data.level || 1; }
    preload() { 
        this.load.audio('click','https://actions.google.com/sounds/v1/cartoon/wood_plank_flicks.ogg');
        this.load.audio('match','https://actions.google.com/sounds/v1/cartoon/pop.ogg');
    }
    create() {
        this.add.rectangle(400,300,800,600,0xFFFFE0); // fond jaune clair

        this.timeLeft = this.level===1?30:60;
        this.score = 0;
        this.timerText = this.add.text(20,20,'Time: '+this.timeLeft,{fontSize:'32px',color:'#333',fontStyle:'bold'});
        this.scoreText = this.add.text(550,20,'Found: '+this.score,{fontSize:'32px',color:'#333',fontStyle:'bold'});

        // Emojis
        this.emojisArray=['😀','😎','😍','😂','🥰','😜','🤩','😇'];
        this.pairs = this.level===1?8:12;
        this.cards=[];
        let cardEmojis=[];
        for(let i=0;i<this.pairs;i++){ cardEmojis.push(this.emojisArray[i%this.emojisArray.length]); cardEmojis.push(this.emojisArray[i%this.emojisArray.length]); }
        Phaser.Utils.Array.Shuffle(cardEmojis);

        this.selected=null; this.matched=0;
        const startX=200,startY=150,spacingX=100,spacingY=100;
        for(let i=0;i<cardEmojis.length;i++){
            const row=Math.floor(i/4),col=i%4;
            const card=this.add.text(startX+col*spacingX,startY+row*spacingY,'❓',{fontSize:'64px'}).setOrigin(0.5).setInteractive();
            card.emoji=cardEmojis[i]; card.revealed=false;
            card.on('pointerdown',()=>this.revealCard(card));
            this.cards.push(card);
        }

        // Timer
        this.timerEvent=this.time.addEvent({delay:1000,loop:true,callback:()=>{
            this.timeLeft--; this.timerText.setText('Time: '+this.timeLeft);
            if(this.timeLeft<=0)this.endGame();
        }});
    }

    revealCard(card){
        if(card.revealed||this.selected===card)return;
        card.setText(card.emoji); this.sound.play('match');
        if(!this.selected){ this.selected=card; } 
        else{
            if(this.selected.emoji===card.emoji){
                this.selected=null;
                this.matched++; this.score++; this.scoreText.setText('Found: '+this.score);
                if(this.matched===this.cards.length/2)this.endGame(true);
            } else{
                const first=this.selected; this.selected=null;
                this.time.delayedCall(800,()=>{first.setText('❓');card.setText('❓');},[],this);
            }
        }
    }

    endGame(win=false){
        this.timerEvent.remove();
        const overlay=this.add.rectangle(400,300,800,600,0x000000,0.5);
        const msgText=this.add.text(400,250,win?'Level Complete!':'Time Over!',{fontSize:'48px',color:'#FFF',fontStyle:'bold'}).setOrigin(0.5);

        // Bouton restart
        const btnBg=this.add.rectangle(400,350,300,70,0xFF6347).setOrigin(0.5).setInteractive({useHandCursor:true});
        const btnText=this.add.text(400,350,'Restart',{fontSize:'32px',color:'#FFF',fontStyle:'bold'}).setOrigin(0.5);
        btnBg.on('pointerover',()=>btnBg.setFillStyle(0xFF4500));
        btnBg.on('pointerout',()=>btnBg.setFillStyle(0xFF6347));
        btnBg.on('pointerdown',()=>{ this.scene.start('MainMenu'); this.sound.play('click'); });
    }
}

// --- CONFIG ---
const config = {
    type: Phaser.AUTO,
    width: 800,
    height: 600,
    parent: document.body,
    scene: [MainMenu,MainGame]
};

// --- START GAME ---
new Phaser.Game(config);
</script>
</body>
</html>
