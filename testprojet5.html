<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>🎮 Emoji Match 🎮</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.min.js"></script>
<style>
  body { margin: 0; background: #f0f8ff; display:flex; justify-content:center; align-items:center; height:100vh;}
  canvas { border: 2px solid #000; }
</style>
</head>
<body>

<script>
// ---------- Utilitaire pour créer un bouton ----------
function createButton(scene, x, y, text, color, bgColor, callback, fontSize='28px'){
  const container = scene.add.container(x, y);
  const rect = scene.add.rectangle(0,0,250,60,bgColor,0.8).setStrokeStyle(3,0xFFFFFF);
  const btnText = scene.add.text(0,0,text,{fontSize:fontSize,fontStyle:'bold',color:color}).setOrigin(0.5);
  container.add([rect,btnText]);
  container.setSize(rect.width, rect.height);
  container.setInteractive({useHandCursor:true})
           .on('pointerdown', callback)
           .on('pointerover', ()=>scene.tweens.add({targets:container,scale:1.05,duration:150,yoyo:true}))
           .on('pointerout', ()=>container.setScale(1));
  return container;
}

// ---------- Données des niveaux ----------
const levels = [
  { time: 60, pairs: 8 },
  { time: 90, pairs: 12 },
  { time: 120, pairs: 15 }
];

// ---------- Scènes ----------
class PreloadScene extends Phaser.Scene {
  constructor(){ super('PreloadScene'); }
  preload(){
    this.load.audio('click','https://actions.google.com/sounds/v1/cartoon/wood_plank_flicks.ogg');
    this.load.audio('match','https://actions.google.com/sounds/v1/cartoon/pop.ogg');
    this.load.audio('bgMusic','https://wafa258.github.io/cv/xmas.mp3');

    // Images cartes thème animaux
    this.load.image('lion','https://i.imgur.com/1Y4C9H2.png');
    this.load.image('dog','https://i.imgur.com/Jq3E4vJ.png');
    this.load.image('cat','https://i.imgur.com/q7u0LhG.png');
    this.load.image('elephant','https://i.imgur.com/4xP7W7U.png');

    // Images cartes thème fruits
    this.load.image('apple','https://i.imgur.com/o6xH7zR.png');
    this.load.image('banana','https://i.imgur.com/4xBf7vX.png');
    this.load.image('cherry','https://i.imgur.com/q4r9U5C.png');

    // Images cartes thème célébrités
    this.load.image('obama','https://i.imgur.com/XxT2KkI.png');
    this.load.image('elon','https://i.imgur.com/3w1iWKU.png');
    this.load.image('beyonce','https://i.imgur.com/0x8Pj7K.png');

    // Image dos de carte
    this.load.image('backCard','https://i.imgur.com/NrJ6F7r.png');
  }
  create(){ this.scene.start('MainMenu'); }
}

class MainMenu extends Phaser.Scene {
  constructor(){ super('MainMenu'); }
  create(){
    this.add.rectangle(450,300,900,600,0xE800F0);
    this.add.text(450,130,'🎮 Emoji Match 🎮',{fontSize:'36px',color:'#FFF',fontStyle:'bold'}).setOrigin(0.5);

    // Start Level 1
    this.startButton = createButton(this,450,250,'Start Level 1','#FFFFFF',0xF2509B,()=>{ 
      if(!this.selectedTheme){
        alert('Veuillez choisir un thème avant de commencer !'); 
        return;
      }
      this.sound.play('click'); 
      this.scene.start('MainGame',{level:1, theme:this.selectedTheme}); 
    });

    // Texte thème
    this.add.text(450,320,'Choisis ton thème :',{fontSize:'24px',color:'#fff'}).setOrigin(0.5);

    // Boutons thèmes
    const themes = [
      {name:'Emoji',data:'emoji'},
      {name:'Animaux',data:'animals'},
      {name:'Fruits & Légumes',data:'fruits'},
      {name:'Célébrités',data:'celebs'}
    ];

    this.selectedTheme = null;
    themes.forEach((t,i)=>{
      const btn = createButton(this,200 + i*170,380,t.name,'#fff',0xFF6347,()=>{
        this.sound.play('click');
        this.selectedTheme = t.data;

        // Indiquer thème sélectionné
        themes.forEach((th,j)=>this.children.getByName('themeBtn'+j).setScale(1));
        btn.setScale(1.2);
      });
      btn.setName('themeBtn'+i);
    });
  }
}

class LevelTransition extends Phaser.Scene {
  constructor(){ super('LevelTransition'); }
  init(data){ this.nextLevel = data.level || 2; this.theme = data.theme; }
  create(){
    this.add.rectangle(450,300,900,600,0xEA5EF2);
    this.add.text(450,180,'Félicitations🥳',{fontSize:'44px',color:'#FF4500',fontStyle:'bold'}).setOrigin(0.5);
    this.add.text(450,250,'Jouez au niveau '+this.nextLevel+' !',{fontSize:'28px',color:'#000',fontStyle:'bold'}).setOrigin(0.5);
    createButton(this,450,350,'Level '+this.nextLevel,'#FFFFFF',0xFF6347,()=>{ 
      this.sound.play('click'); 
      this.scene.start('MainGame',{level:this.nextLevel, theme:this.theme}); 
    });
  }
}

class MainGame extends Phaser.Scene {
  constructor(){ super('MainGame'); }
  init(data){ this.level = data.level || 1; this.theme = data.theme || 'emoji'; }

  create(){
    this.add.rectangle(450,300,900,600,0xDDB8F2);
    const levelData = levels[this.level-1] || levels[0];
    this.timeLeft = levelData.time;
    this.pairs = levelData.pairs;
    this.score = 0;
    this.matched = 0;
    this.selected = null;

    this.timerText = this.add.text(20,20,'⏳ Time: '+this.timeLeft,{fontSize:'36px',color:'#333',fontStyle:'bold'});
    this.scoreText = this.add.text(700,20,'Found: '+this.score,{fontSize:'36px',color:'#333',fontStyle:'bold'});

    // Icônes en bas
    const bottomY = 550;
    this.musicIcon = this.add.text(850,bottomY,'🔊',{fontSize:'40px',color:'#333'}).setOrigin(0.5).setInteractive();
    this.musicIcon.on('pointerdown',()=>{
      this.sound.unlock();
      if(!this.game.bgMusic){
        this.game.bgMusic=this.sound.add('bgMusic',{loop:true,volume:0.4});
        this.game.bgMusic.play();
      }else{
        this.game.bgMusic.isPlaying?this.game.bgMusic.pause():this.game.bgMusic.resume();
      }
    });

    this.pauseText = this.add.text(50,bottomY,'⏸️',{fontSize:'40px',color:'#F2509B'}).setOrigin(0.5).setInteractive();
    this.pauseText.on('pointerdown',()=>{ 
      this.scene.pause();
      this.scene.launch('PauseScene',{parent:this}); 
    });
    this.pauseText.on('pointerover',()=>this.pauseText.setColor('#FF85C1'));
    this.pauseText.on('pointerout',()=>this.pauseText.setColor('#F2509B'));

    // Définir cartes selon thème
    if(this.theme==='emoji'){
      this.cardEmojis=['😀','😎','😍','😂','🥰','😜','🤩','😇','😱','🤪','🤓','🤑','🥳','😏','🤠','🤖'];
    } else if(this.theme==='animals'){
      this.cardEmojis=['lion','dog','cat','elephant'];
    } else if(this.theme==='fruits'){
      this.cardEmojis=['apple','banana','cherry'];
    } else if(this.theme==='celebs'){
      this.cardEmojis=['obama','elon','beyonce'];
    }

    // Créer les paires et mélanger
    let cardEmojis=[];
    for(let i=0;i<this.pairs;i++) cardEmojis.push(this.cardEmojis[i%this.cardEmojis.length],this.cardEmojis[i%this.cardEmojis.length]);
    Phaser.Utils.Array.Shuffle(cardEmojis);

    this.cards=[];
    const cols = this.level===1?4:5;
    const spacingX = 100;
    const spacingY = 100;
    const canvasWidth = 900;
    const startX = this.level===1?(canvasWidth-(cols-1)*spacingX)/2:200;
    const startY = 160;

    for(let i=0;i<cardEmojis.length;i++){
      const row=Math.floor(i/cols);
      const col=i%cols;
      const x=startX+col*spacingX;
      const y=startY+row*spacingY;
      let card;
      if(this.theme==='emoji'){
        card=this.add.text(x,y,'❓',{fontSize:'64px',fontFamily:'Arial'}).setOrigin(0.5).setInteractive();
        card.realKey=cardEmojis[i];
      } else {
        card=this.add.image(x,y,'backCard').setDisplaySize(80,80).setInteractive();
        card.realKey=cardEmojis[i];
      }
      card.revealed=false;
      card.on('pointerdown',()=>this.revealCard(card));
      this.cards.push(card);
    }

    this.clignotementTween=null;
    this.timerEvent=this.time.addEvent({delay:1000,loop:true,callback:()=>{
      this.timeLeft--;
      this.timerText.setText('⏳ Time: '+this.timeLeft);
      if(this.timeLeft <= 10 && !this.clignotementTween){
        this.timerText.setColor('#FF0000');
        this.clignotementTween=this.tweens.add({targets:this.timerText,alpha:0,duration:300,yoyo:true,repeat:-1});
      }
      if(this.timeLeft <= 0) this.endGame();
    }});
  }

  revealCard(card){
    if(card.revealed||this.selected===card) return;

    if(this.theme==='emoji'){
      card.setText(card.realKey);
    } else {
      card.setTexture(card.realKey);
    }
    card.revealed=true;

    if(!this.selected){ this.selected=card; }
    else{
      if(this.selected.realKey===card.realKey){
        this.sound.play('click');
        this.tweens.add({targets:[this.selected,card],scale:{from:1,to:1.3},duration:150,yoyo:true,ease:'Back'});
        this.selected=null;
        this.matched++; this.score++; this.scoreText.setText('Found: '+this.score);
        if(this.matched===this.cards.length/2) this.endLevel();
      }else{
        const first=this.selected; this.selected=null;
        this.time.delayedCall(500,()=>{
          if(this.theme==='emoji'){ first.setText('❓'); card.setText('❓'); }
          else { first.setTexture('backCard'); card.setTexture('backCard'); }
          first.revealed=false; card.revealed=false;
        });
        this.sound.play('match');
      }
    }
  }

  endLevel(){
    this.cards.forEach(c=>this.tweens.add({targets:c,alpha:0,duration:500}));
    this.time.delayedCall(600,()=>{
      if(this.level<levels.length) this.scene.start('LevelTransition',{level:this.level+1, theme:this.theme});
      else this.endGame(true);
    });
  }

  endGame(win=false){
    if(this.clignotementTween) this.clignotementTween.stop();
    this.timerEvent.remove();
    this.add.rectangle(450,300,900,600,0x000000,0.5);
    this.add.text(450,180,win?'Level Complete!':'Time Over!',{fontSize:'44px',color:'#FFF',fontStyle:'bold'}).setOrigin(0.5);
    createButton(this,450,280,'Restart','#FFFFFF',0xFF6347,()=>{ 
      this.sound.play('click'); 
      this.scene.start('MainMenu'); 
    });
  }
}

class PauseScene extends Phaser.Scene{
  constructor(){ super('PauseScene'); }
  init(data){ this.parent=data.parent; }
  create(){
    this.add.rectangle(450,300,900,600,0x000000,0.5);
    this.add.text(450,180,'Paused',{fontSize:'44px',color:'#FFF',fontStyle:'bold'}).setOrigin(0.5);
    createButton(this,450,300,'▶ Resume','#FFFFFF',0xF2509B,()=>{this.scene.stop(); this.parent.scene.resume();},'32px');
  }
}

const config={
  type: Phaser.AUTO,
  width:900,
  height:600,
  scene:[PreloadScene,MainMenu,LevelTransition,MainGame,PauseScene]
};

new Phaser.Game(config);
</script>

</body>
</html>
