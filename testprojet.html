<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Emoji Match</title>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.min.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #FFD700, #FF8C00); /* fond joyeux dégradé orange/jaune */
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    #game-container {
      width: 800px;
      height: 600px;
      position: relative;
    }
  </style>
</head>
<body>
  <div id="game-container"></div>

  <script>
  class Boot extends Phaser.Scene {
    constructor() { super('Boot'); }
    create() {
      this.registry.set('level', 1);
      this.scene.start('MainMenu');
    }
  }

  class MainMenu extends Phaser.Scene {
    constructor() { super('MainMenu'); }
    create() {
      // Fond du menu
      this.add.rectangle(400, 300, 800, 600, 0xFFF8DC); // fond crème pour contraste
      // Titre original
      this.add.text(400, 150, 'Emoji Match', { fontSize: '64px', color: '#FF4500', fontStyle: 'bold' }).setOrigin(0.5);
      // Bouton start modernisé
      const btn = this.add.text(400, 400, 'Start Level 1', {
        fontSize: '32px',
        color: '#fff',
        backgroundColor: '#FF6347',
        padding: { x: 20, y: 10 },
        align: 'center',
        fixedWidth: 200
      }).setOrigin(0.5).setInteractive({ useHandCursor: true });

      btn.on('pointerdown', () => {
        this.scene.start('Game', { level: 1 });
      });
    }
  }

  class Game extends Phaser.Scene {
    constructor() { super('Game'); }
    init(data) { this.level = data.level; this.timeLimit = (this.level === 1 ? 60 : 90); }
    create() {
      // Fond joyeux contrasté
      this.add.rectangle(400, 300, 800, 600, 0x87CEEB); // fond bleu ciel
      // Timer et score visibles
      this.score = 0;
      this.timerText = this.add.text(20, 20, `Time: ${this.timeLimit}`, { fontSize: '40px', color: '#000', stroke: '#fff', strokeThickness: 6 });
      this.scoreText = this.add.text(550, 20, `Found: 0`, { fontSize: '40px', color: '#000', stroke: '#fff', strokeThickness: 6 });

      // Emojis Unicode
      let emojis = ['😀','😎','🎯','🎲','🤖','🐶','🍕','⭐'];
      let pairs = [...emojis, ...emojis];
      Phaser.Utils.Array.Shuffle(pairs);

      this.cards = [];
      const cols = 4, rows = 4;
      const spacingX = 150, spacingY = 120;
      const startX = 200, startY = 180;

      for (let i = 0; i < cols * rows; i++) {
        let x = startX + (i % cols) * spacingX;
        let y = startY + Math.floor(i / cols) * spacingY;
        let frame = this.add.rectangle(x, y, 120, 100, 0xffffff).setStrokeStyle(4, 0xFF8C00);
        let card = this.add.text(x, y, '❓', { fontSize: '64px', color: '#000' }).setOrigin(0.5).setInteractive();
        card.emoji = pairs[i];
        card.revealed = false;
        card.frame = frame;
        this.cards.push(card);
      }

      this.first = null;
      this.input.on('gameobjectdown', (pointer, card) => {
        if (card.revealed) return;
        card.setText(card.emoji);
        card.revealed = true;
        card.frame.setStrokeStyle(4, 0x32CD32); // vert pour carte révélée
        if (!this.first) {
          this.first = card;
        } else {
          if (this.first.emoji === card.emoji) {
            this.score++;
            this.scoreText.setText(`Found: ${this.score}`);
          } else {
            this.time.delayedCall(600, () => {
              card.setText('❓');
              card.revealed = false;
              card.frame.setStrokeStyle(4, 0xFF8C00);
              this.first.setText('❓');
              this.first.revealed = false;
              this.first.frame.setStrokeStyle(4, 0xFF8C00);
              this.first = null;
            });
            return;
          }
          this.first = null;
        }
      });

      this.timerEvent = this.time.addEvent({
        delay: this.timeLimit * 1000,
        callback: () => this.timeOver(),
        callbackScope: this
      });
    }

    timeOver() {
      const btn = this.add.text(400, 500, 'Start Again', {
        fontSize: '32px',
        color: '#fff',
        backgroundColor: '#FF4500',
        padding: { x: 20, y: 10 }
      }).setOrigin(0.5).setInteractive({ useHandCursor: true });

      btn.on('pointerdown', () => this.scene.start('MainMenu'));
    }

    update() {
      let rem = Math.ceil(this.timerEvent.getRemainingSeconds());
      this.timerText.setText(`Time: ${rem}`);
    }
  }

  const config = {
    type: Phaser.AUTO,
    width: 800,
    height: 600,
    parent: 'game-container',
    scene: [Boot, MainMenu, Game]
  };

  new Phaser.Game(config);
  </script>
</body>
</html>
