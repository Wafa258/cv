<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Emoji Match - Exemple</title>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.min.js"></script>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: linear-gradient(135deg, #ff9a9e, #fad0c4, #fbc2eb, #a1c4fd); display:flex; flex-direction:column; align-items:center; }
    h1 { color:#333; margin-top:20px; text-align:center; }
  </style>
</head>
<body>
  <h1>🎮 Emoji Match 🎮</h1>
  <div id="phaser-example"></div>

  <script>
class MainGame extends Phaser.Scene {
    constructor() { super('MainGame'); }
    create() {
        this.add.text(400, 50, 'Cliquez sur deux emojis identiques', { font: '24px Arial', fill: '#333' }).setOrigin(0.5);

        this.emojis = ['😀','😎','🎯','🎲','🕹️','😀','😎','🎯','🎲','🕹️','😀','😎','🎯','🎲','🕹️','😀'];
        Phaser.Utils.Array.Shuffle(this.emojis);

        this.tiles = [];
        for(let i=0;i<16;i++){
            let x = 150 + (i%4)*130;
            let y = 120 + Math.floor(i/4)*130;
            let tile = this.add.text(x, y, this.emojis[i], { font: '64px Arial', fill:'#000' }).setInteractive().setOrigin(0.5);
            tile.revealed = false;
            tile.emoji = this.emojis[i];
            this.tiles.push(tile);
        }

        this.first = null;
        this.input.on('gameobjectdown', (pointer, obj)=>{
            if(obj.revealed) return;
            obj.revealed = true;
            obj.setStyle({ fill:'#f00' });
            if(!this.first) {
                this.first = obj;
            } else {
                if(this.first.emoji === obj.emoji){
                    // paire trouvée
                } else {
                    this.time.delayedCall(500, ()=>{
                        this.first.setStyle({ fill:'#000' });
                        obj.setStyle({ fill:'#000' });
                        this.first.revealed = false;
                        obj.revealed = false;
                        this.first = null;
                    });
                }
                this.first = null;
            }
        });
    }
}

const config = {
    type: Phaser.AUTO,
    width: 800,
    height: 600,
    parent: 'phaser-example',
    backgroundColor: 0xffffff,
    scene: [ MainGame ]
};

new Phaser.Game(config);
  </script>
</body>
</html>
