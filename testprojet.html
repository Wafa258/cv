<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Emoji Match Game</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.js"></script>
<style>
    body {
        margin: 0;
        background: linear-gradient(135deg, #FFDEE9, #B5FFFC);
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }
    #phaser-example {
        border-radius: 20px;
        overflow: hidden;
        box-shadow: 0 10px 20px rgba(0,0,0,0.3);
    }
</style>
</head>
<body>
<div id="phaser-example"></div>
<script>

// ------------- GLOBAL VARIABLES ----------------
const LEVELS = [
    { emojis: ['😀','😎','🥳','😂','😇','😍','🤩','😋'], time: 45 },
    { emojis: ['😀','😎','🥳','😂','😇','😍','🤩','😋','😡','🤯','🤖','👻'], time: 90 }
];

// ------------- SCENES ----------------

// Boot Scene
class Boot extends Phaser.Scene {
    constructor() { super('Boot'); }
    create() {
        this.scene.start('MainMenu');
    }
}

// Main Menu Scene
class MainMenu extends Phaser.Scene {
    constructor() { super('MainMenu'); }
    create() {
        this.cameras.main.setBackgroundColor('#88E0EF');
        const style = { font: "48px Arial", color: "#222", fontStyle: "bold", align: "center" };
        this.add.text(400, 200, "Emoji Match Game", style).setOrigin(0.5);
        
        const button = this.add.text(400, 400, "Start Level 1", { font: "32px Arial", color: "#fff", backgroundColor: "#FF7F50", padding: { x: 20, y: 10 }, borderRadius: 10 }).setOrigin(0.5).setInteractive();
        button.on('pointerdown', () => { this.scene.start('MainGame', { level: 0 }); });
    }
}

// Main Game Scene
class MainGame extends Phaser.Scene {
    constructor() { super('MainGame'); }
    init(data) { this.levelIndex = data.level; }
    preload() {
        this.load.audio('bgm', 'https://actions.google.com/sounds/v1/ambiences/underwater_bubbles.ogg');
        this.load.audio('match', 'https://actions.google.com/sounds/v1/cartoon/clang_and_wobble.ogg');
    }
    create() {
        // background
        this.cameras.main.setBackgroundColor('#FFF9C4');

        // music
        this.bgm = this.sound.add('bgm', { loop:true, volume:0.2 });
        if(!this.bgm.isPlaying) this.bgm.play();
        this.matchSound = this.sound.add('match');

        // level config
        this.level = LEVELS[this.levelIndex];
        this.emojisList = this.level.emojis.concat(this.level.emojis); // duplicates for matching
        Phaser.Utils.Array.Shuffle(this.emojisList);
        this.timeLeft = this.level.time;
        this.selected = [];
        this.foundCount = 0;

        // display timer
        const style = { font: "32px Arial", color:"#333", fontStyle:"bold" };
        this.timerText = this.add.text(650, 20, `Time: ${this.timeLeft}s`, style);
        this.scoreText = this.add.text(20, 20, `Found: ${this.foundCount}`, style);

        // create card grid
        this.cards = [];
        const gridX = 100, gridY = 100, spacing = 100;
        const cols = 4;
        for(let i=0;i<this.emojisList.length;i++){
            const row = Math.floor(i/cols);
            const col = i%cols;
            const card = this.add.text(gridX + col*spacing, gridY + row*spacing, "❓", { font:"64px Arial", color:"#555", backgroundColor:"#FFF", padding:{x:10,y:10}, align:"center" })
                .setOrigin(0.5)
                .setInteractive();
            card.emoji = this.emojisList[i];
            card.flipped = false;
            card.on('pointerdown', () => this.flipCard(card));
            this.cards.push(card);
        }

        // timer event
        this.timeEvent = this.time.addEvent({ delay: 1000, callback: this.tick, callbackScope: this, loop: true });
    }

    flipCard(card){
        if(card.flipped || this.selected.length >=2) return;
        card.setText(card.emoji);
        card.flipped = true;
        this.selected.push(card);

        if(this.selected.length===2){
            this.time.delayedCall(500, () => {
                if(this.selected[0].emoji === this.selected[1].emoji){
                    this.selected.forEach(c => c.setVisible(false));
                    this.matchSound.play();
                    this.foundCount++;
                    this.scoreText.setText(`Found: ${this.foundCount}`);
                    if(this.foundCount === this.level.emojis.length){
                        this.levelComplete();
                    }
                } else {
                    this.selected.forEach(c => { c.setText("❓"); c.flipped=false; });
                }
                this.selected = [];
            });
        }
    }

    tick(){
        this.timeLeft--;
        this.timerText.setText(`Time: ${this.timeLeft}s`);
        if(this.timeLeft<=0){
            this.gameOver();
        }
    }

    levelComplete(){
        this.timeEvent.remove(false);
        const style = { font: "48px Arial", color:"#fff", fontStyle:"bold", backgroundColor:"#4CAF50", padding:{x:20,y:20}, align:"center" };
        const msg = this.add.text(400, 300, `Félicitations !\nJouez le niveau ${this.levelIndex+2}`, style).setOrigin(0.5);
        if(this.levelIndex+1 < LEVELS.length){
            const btn = this.add.text(400, 450, `Start Level ${this.levelIndex+2}`, { font: "32px Arial", color: "#fff", backgroundColor:"#FF5722", padding:{x:20,y:10}, borderRadius:10 })
                .setOrigin(0.5)
                .setInteractive();
            btn.on('pointerdown', () => this.scene.start('MainGame',{level:this.levelIndex+1}));
        }
    }

    gameOver(){
        this.timeEvent.remove(false);
        const style = { font: "48px Arial", color:"#fff", fontStyle:"bold", backgroundColor:"#F44336", padding:{x:20,y:20}, align:"center" };
        const msg = this.add.text(400, 300, "Temps écoulé !\nRecommencez ?", style).setOrigin(0.5);
        const btn = this.add.text(400, 450, `Rejouer Niveau ${this.levelIndex+1}`, { font: "32px Arial", color: "#fff", backgroundColor:"#FF5722", padding:{x:20,y:10}, borderRadius:10 })
            .setOrigin(0.5)
            .setInteractive();
        btn.on('pointerdown', () => this.scene.start('MainGame',{level:this.levelIndex}));
    }
}

// ------------- CONFIG ----------------
const config = {
    type: Phaser.AUTO,
    width: 800,
    height: 600,
    parent: 'phaser-example',
    scene: [ Boot, MainMenu, MainGame ]
};

const game = new Phaser.Game(config);

</script>
</body>
</html>
