<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>🎮 Emoji Match 🎮</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.min.js"></script>

<style>
    body { 
        margin: 0; 
        background: #f0f8ff;
        overflow: hidden;      /* IMPORTANT – empêche les décalages */
    }
    canvas { 
        border: 2px solid #000;
        display: block;        /* IMPORTANT – empêche le centrage incorrect */
        margin: 0 auto; 
    }
</style>
</head>
<body>

<script>
// --- SCENES ---
class MainMenu extends Phaser.Scene {
    constructor() { super('MainMenu'); }

    preload() {
        this.load.audio('click', 'https://actions.google.com/sounds/v1/cartoon/wood_plank_flicks.ogg');
        this.load.audio('bgmusic', 'https://cdn.pixabay.com/audio/2022/03/15/audio_35fc9da8f6.mp3');
    }

    create() {
        this.add.rectangle(400,300,800,600,0xc0428a);
        this.add.text(400,150,'🎮 Emoji Match 🎮',{fontSize:'40px', color:'#FFFFFF', fontStyle:'bold'}).setOrigin(0.5);

        // 🎵 Musique
        if (!this.bgmusic) {
            this.bgmusic = this.sound.add('bgmusic', { loop: true, volume: 0.4 });
            this.bgmusic.play();
        }

        // Bouton START
        const btn = this.add.rectangle(400,400,300,70,0xFF6347).setInteractive({ useHandCursor:true });
        this.add.text(400,400,'Start Level 1',{fontSize:'32px',color:'#FFF',fontStyle:'bold'}).setOrigin(0.5);

        btn.on('pointerover',()=>btn.setFillStyle(0xFF4500));
        btn.on('pointerout',()=>btn.setFillStyle(0xFF6347));

        btn.on('pointerdown',()=>{
            this.sound.play('click');
            this.scene.start('MainGame',{level:1});
        });
    }
}

class LevelTransition extends Phaser.Scene {
    constructor(){ super('LevelTransition'); }
    init(data){ this.nextLevel = data.level || 2; }

    preload(){
        this.load.audio('click','https://actions.google.com/sounds/v1/cartoon/wood_plank_flicks.ogg');
    }

    create(){
        this.add.rectangle(400,300,800,600,0xFFD700);
        this.add.text(400,250,'Félicitations !',{fontSize:'48px',color:'#FF4500'}).setOrigin(0.5);
        this.add.text(400,320,'Jouez au niveau '+this.nextLevel+' !',{fontSize:'32px',color:'#000'}).setOrigin(0.5);

        const btn=this.add.rectangle(400,400,300,70,0xFF6347)
             .setInteractive({ useHandCursor:true });

        this.add.text(400,400,'Level '+this.nextLevel,{fontSize:'32px',color:'#FFF'}).setOrigin(0.5);

        btn.on('pointerdown',()=>{
            this.sound.play('click');
            this.scene.start('MainGame',{level:this.nextLevel});
        });
    }
}

class MainGame extends Phaser.Scene {
    constructor(){ super('MainGame'); }

    init(data){ this.level = data.level || 1; }

    preload(){
        this.load.audio('click','https://actions.google.com/sounds/v1/cartoon/wood_plank_flicks.ogg');
        this.load.audio('match','https://actions.google.com/sounds/v1/cartoon/pop.ogg');
    }

    create(){
        this.add.rectangle(400,300,800,600,0xFFFFE0);

        // Timer & score
        if (this.level === 1){ this.timeLeft=60; this.pairs=8; }
        else { this.timeLeft=90; this.pairs=12; }

        this.score=0;

        this.timerText=this.add.text(20,20,'Time: '+this.timeLeft,{fontSize:'32px'});
        this.scoreText=this.add.text(550,20,'Found: '+this.score,{fontSize:'32px'});

        // Bouton mute
        this.musicBtn=this.add.text(780,20,'🔊',{fontSize:'32px'})
            .setOrigin(1,0)
            .setInteractive({useHandCursor:true});

        this.musicBtn.on('pointerdown',()=>{
            this.sound.mute = !this.sound.mute;
            this.musicBtn.setText(this.sound.mute ? '🔇' : '🔊');
        });

        this.emojis=['😀','😎','😍','😂','🥰','😜','🤩','😇','😱','🤪','🤓','🤑','🥳','😏','🤠','🤖'];

        let list=[];
        for(let i=0;i<this.pairs;i++){
            list.push(this.emojis[i]);
            list.push(this.emojis[i]);
        }
        Phaser.Utils.Array.Shuffle(list);

        const cols=4;
        const startX=200,startY=150,spX=120,spY=120;

        this.cards=[];
        this.selected=null;
        this.matched=0;

        for(let i=0;i<list.length;i++){
            const r=Math.floor(i/cols), c=i%cols;

            const card=this.add.text(startX+c*spX,startY+r*spY + 5,'❓',{
                fontSize:'58px',
                fontFamily:'Arial',
                padding:{top:10,bottom:10}
            }).setOrigin(0.5).setInteractive();

            card.emoji=list[i];

            card.on('pointerdown',()=>this.revealCard(card));

            this.cards.push(card);
        }

        this.timerEvent=this.time.addEvent({
            delay:1000,
            loop:true,
            callback:()=>{
                this.timeLeft--;
                this.timerText.setText('Time: '+this.timeLeft);
                if(this.timeLeft<=0)this.endGame();
            }
        });
    }

    revealCard(card){
        if(this.selected===card) return;

        card.setText(card.emoji);

        this.tweens.add({targets:card,scale:1.2,yoyo:true,duration:120});

        if(!this.selected){
            this.selected=card;
        } else {
            if(this.selected.emoji===card.emoji){
                this.sound.play('click');
                this.selected=null;
                this.score++;
                this.scoreText.setText('Found: '+this.score);
                this.matched++;

                if(this.matched===this.cards.length/2){
                    this.level===1?
                        this.scene.start('LevelTransition',{level:2}) :
                        this.endGame(true);
                }

            } else {
                const first=this.selected;
                this.selected=null;

                this.time.delayedCall(800,()=>{
                    first.setText('❓');
                    card.setText('❓');
                });

                this.sound.play('match');
            }
        }
    }

    endGame(win=false){
        this.timerEvent.remove();

        this.add.rectangle(400,300,800,600,0x000,0.5);
        this.add.text(400,250,win?'Level Complete!':'Time Over!',
        {fontSize:'48px',color:'#FFF'}).setOrigin(0.5);

        const btn=this.add.rectangle(400,350,300,70,0xFF6347)
            .setInteractive({useHandCursor:true});
        this.add.text(400,350,'Restart',{fontSize:'32px',color:'#FFF'}).setOrigin(0.5);

        btn.on('pointerdown',()=>{
            this.sound.play('click');
            this.scene.start('MainMenu');
        });
    }
}

// --- CONFIG ---
const config={
    type: Phaser.AUTO,
    width:800,
    height:600,
    scene:[MainMenu,LevelTransition,MainGame]
};

new Phaser.Game(config);
</script>
</body>
</html>
