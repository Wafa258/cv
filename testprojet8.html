<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>🎮 Emoji Match 🎮</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.min.js"></script>
<style>
  body {
    margin: 0;
    background: #f0f8ff;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
  }
  canvas { border: 2px solid #000; }
</style>
</head>
<body>

<script>
// -------------------------
// THEMES
// -------------------------
const THEMES = {
  emoji: ['😀','😎','😍','😂','🥰','😜','🤩','😇','😱','🤪','🤓','🤑','🥳','😏','🤠','🤖'],
  animals: ['🐶','🐱','🦁','🐯','🐭','🐹','🐰','🐻','🐼','🐨','🐸','🐵','🐔','🦊','🐴','🦄'],
  fruits: ['🍎','🍌','🍇','🍉','🍓','🍒','🍑','🍍','🥝','🥥','🍐','🍊','🥕','🍅','🥦','🌽'],
  sport: ['⚽','🏀','🏈','⚾','🎾','🏓','🏒','🥊','🎱','🤿','🥋','⛷️','🏄','🚴','⛳','🥅']
};

let selectedTheme = "emoji";
let nightMode = false;

// -------------------------
// LEVELS
// -------------------------
const levels = [
  { time: 60, pairs: 8 },
  { time: 90, pairs: 12 },
  { time: 120, pairs: 15 }
];

// -------------------------
// BUTTON
// -------------------------
function createButton(scene, x, y, text, color, bgColor, callback, fontSize='28px'){
  const container = scene.add.container(x, y);
  const rect = scene.add.rectangle(0,0,250,60,bgColor,0.8).setStrokeStyle(3,0xFFFFFF);
  const btnText = scene.add.text(0,0,text,{fontSize, fontStyle:'bold', color}).setOrigin(0.5);
  container.add([rect,btnText]);
  container.setSize(rect.width, rect.height);
  container.setInteractive({useHandCursor:true})
    .on('pointerdown', callback)
    .on('pointerover', ()=>container.setScale(1.05))
    .on('pointerout', ()=>container.setScale(1));
  return container;
}

// -------------------------
// PRELOAD
// -------------------------
class PreloadScene extends Phaser.Scene {
  constructor(){ super('PreloadScene'); }
  preload(){
    this.load.audio('click','https://actions.google.com/sounds/v1/cartoon/pop.ogg');
    this.load.audio('match','https://actions.google.com/sounds/v1/cartoon/wood_plank_flicks.ogg');
    this.load.audio('bgMusic','https://wafa258.github.io/cv/xmas.mp3');
  }
  create(){ this.scene.start('MainMenu'); }
}

// -------------------------
// MENU
// -------------------------
class MainMenu extends Phaser.Scene {
  constructor(){ super('MainMenu'); }
  create(){
    this.add.rectangle(450,300,900,600,0xE800F0);
    this.add.text(450,120,'🎮 Emoji Match 🎮',{fontSize:'40px',color:'#FFF'}).setOrigin(0.5);
    createButton(this,450,300,'Start','#FFF',0xF2509B,()=>{
      this.scene.start('MainGame',{level:1, theme:selectedTheme});
    });
  }
}

// -------------------------
// GAME
// -------------------------
class MainGame extends Phaser.Scene {
  constructor(){ super('MainGame'); }

  init(data){
    this.level = data.level;
    this.theme = data.theme;
  }

  create(){
    this.sound.unlock(); // 🔊 important

    this.lockBoard = true;

    this.background = this.add.rectangle(450,300,900,600,0xDDB8F2);

    const levelData = levels[this.level-1];
    this.timeLeft = levelData.time;
    this.pairs = levelData.pairs;
    this.score = 0;
    this.matched = 0;
    this.selected = null;

    this.timerText = this.add.text(20,20,'⏳ '+this.timeLeft,{fontSize:'32px',color:'#333'});
    this.scoreText = this.add.text(700,20,'Found: 0',{fontSize:'32px',color:'#333'});

    // 🎵 MUSIC
    this.musicIcon = this.add.text(850,550,'🔊',{fontSize:'36px'}).setInteractive();
    this.musicIcon.on('pointerdown',()=>{
      if(!this.game.bgMusic){
        this.game.bgMusic = this.sound.add('bgMusic',{loop:true,volume:0.4});
        this.game.bgMusic.play();
        this.musicIcon.setText('🔊');
      } else {
        if(this.game.bgMusic.isPlaying){
          this.game.bgMusic.pause();
          this.musicIcon.setText('🔇');
        } else {
          this.game.bgMusic.resume();
          this.musicIcon.setText('🔊');
        }
      }
    });

    // 🃏 CARDS
    const emojis = THEMES[this.theme];
    let cardEmojis = [];
    for(let i=0;i<this.pairs;i++){
      cardEmojis.push(emojis[i], emojis[i]);
    }
    Phaser.Utils.Array.Shuffle(cardEmojis);

    this.cards = [];
    const cols = this.level === 1 ? 4 : 5;
    const spacing = 100;
    const startX = (900 - (cols-1)*spacing)/2;
    const startY = 160;

    for(let i=0;i<cardEmojis.length;i++){
      const row = Math.floor(i/cols);
      const col = i % cols;

      const finalX = startX + col*spacing;
      const finalY = startY + row*spacing;

      const card = this.add.text(450,300,'❓',{fontSize:'64px'})
        .setOrigin(0.5)
        .setInteractive();

      card.finalX = finalX;
      card.finalY = finalY;
      card.emoji = cardEmojis[i];
      card.revealed = false;
      card.alpha = 0;

      card.on('pointerdown',()=>this.flipCard(card));
      this.cards.push(card);
    }

    // 🎴 DISPATCH ANIMATION
    this.cards.forEach((card,i)=>{
      this.tweens.add({
        targets: card,
        x: card.finalX,
        y: card.finalY,
        alpha: 1,
        duration: 500,
        delay: i * 50,
        ease: 'Back.out'
      });
    });

    this.time.delayedCall(700,()=>this.lockBoard=false);

    // ⏱️ TIMER
    this.timerEvent = this.time.addEvent({
      delay:1000,
      loop:true,
      callback:()=>{
        this.timeLeft--;
        this.timerText.setText('⏳ '+this.timeLeft);
        if(this.timeLeft<=0) this.endGame(false);
      }
    });
  }

  flipCard(card){
    if(this.lockBoard || card.revealed || this.selected===card) return;

    card.setText(card.emoji);
    card.revealed = true;

    if(!this.selected){
      this.selected = card;
    } else {
      if(this.selected.emoji === card.emoji){
        this.sound.play('match');
        this.score++;
        this.matched++;
        this.scoreText.setText('Found: '+this.score);
        this.selected = null;

        if(this.matched === this.cards.length/2){
          this.endGame(true);
        }
      } else {
        this.lockBoard = true;
        this.sound.play('click');
        const first = this.selected;
        this.selected = null;
        this.time.delayedCall(700,()=>{
          first.setText('❓'); first.revealed=false;
          card.setText('❓'); card.revealed=false;
          this.lockBoard = false;
        });
      }
    }
  }

  endGame(win){
    this.timerEvent.remove();
    this.add.rectangle(450,300,900,600,0x000000,0.6);
    this.add.text(450,200,win?'🎉 Gagné !':'⏰ Perdu',{fontSize:'48px',color:'#FFF'}).setOrigin(0.5);
    createButton(this,450,320,'Menu','#FFF',0xF2509B,()=>{
      this.scene.start('MainMenu');
    });
  }
}

// -------------------------
const config = {
  type: Phaser.AUTO,
  width:900,
  height:600,
  scene:[PreloadScene,MainMenu,MainGame]
};

new Phaser.Game(config);
</script>
</body>
</html>
