<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Emoji Match</title>
<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #ffecd2, #fcb69f);
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  h1 {
    color: #333;
    margin-top: 20px;
    text-align: center;
  }
  #phaser-example {
    margin-top: 20px;
  }
</style>
</head>
<body>
<h1>🎉 Emoji Match 🎉</h1>
<div id="phaser-example"></div>

<script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.min.js"></script>
<script type="module">

class MainMenu extends Phaser.Scene {
    constructor(){ super('MainMenu'); }
    create(){
        this.cameras.main.setBackgroundColor('#ffecd2');

        this.startText = this.add.text(400,300,'Click to Start',{fontSize:'32px', color:'#333'}).setOrigin(0.5).setInteractive();
        this.startText.on('pointerdown', ()=>{
            this.scene.start('MainGame');
        });
    }
}

class MainGame extends Phaser.Scene {
    constructor() {
        super('MainGame');
        this.cards = [];
        this.firstCard = null;
        this.canClick = true;
        this.matches = 0;
    }

    create(){
        // fond animé simple (dégradé)
        this.cameras.main.setBackgroundColor('#fcb69f');

        // emojis
        const baseEmojis=['😀','😎','🎯','🎲','🕹️','🤖','🐶','🍕'];
        let selectedEmojis=[];
        for(let i=0;i<8;i++){
            selectedEmojis.push(baseEmojis[i],baseEmojis[i]); // paire
        }
        Phaser.Utils.Array.Shuffle(selectedEmojis);

        // grille 4x4
        let startX = 200, startY = 150, spacing = 120;
        for(let i=0;i<16;i++){
            let x = startX + (i%4)*spacing;
            let y = startY + Math.floor(i/4)*spacing;
            let card = this.add.text(x,y,'❓',{fontSize:'64px',backgroundColor:'#fff',padding:{x:10,y:10},align:'center'}).setOrigin(0.5).setInteractive();
            card.emoji = selectedEmojis[i];
            card.revealed = false;
            this.cards.push(card);
        }

        this.input.on('gameobjectdown', this.onCardClicked, this);

        // Score text
        this.scoreText = this.add.text(50,50,'Found: 0',{fontSize:'28px',color:'#333'});

        // Timer 30s
        this.timer = this.time.addEvent({delay:30000, callback:this.gameOver, callbackScope:this});
        this.timerText = this.add.text(650,50,'30',{fontSize:'28px',color:'#333'});
    }

    onCardClicked(pointer, card){
        if(!this.canClick || card.revealed) return;

        card.setText(card.emoji);
        card.setStyle({backgroundColor:'#ffff88'});
        card.revealed = true;

        if(!this.firstCard){
            this.firstCard = card;
        } else {
            this.canClick = false;
            if(this.firstCard.emoji === card.emoji){
                // paire trouvée
                card.setStyle({backgroundColor:'#00ff00'});
                this.firstCard.setStyle({backgroundColor:'#00ff00'});
                this.matches++;
                this.scoreText.setText('Found: '+this.matches);
                this.time.delayedCall(500, ()=>{
                    this.firstCard = null;
                    this.canClick = true;
                });
            } else {
                // pas de correspondance
                this.time.delayedCall(600, ()=>{
                    card.setText('❓');
                    card.setStyle({backgroundColor:'#fff'});
                    card.revealed = false;
                    this.firstCard.setText('❓');
                    this.firstCard.setStyle({backgroundColor:'#fff'});
                    this.firstCard.revealed = false;
                    this.firstCard = null;
                    this.canClick = true;
                });
            }
        }
    }

    update(){
        if(this.timer){
            const remaining = (30 - this.timer.getElapsedSeconds()).toFixed(0);
            this.timerText.setText(remaining.padStart(2,'0'));
        }
    }

    gameOver(){
        this.input.off('gameobjectdown',this.onCardClicked,this);
        this.add.text(400,550,'Game Over! Click to Restart',{fontSize:'28px',color:'#333'}).setOrigin(0.5).setInteractive().on('pointerdown',()=>{
            this.scene.start('MainMenu');
        });
    }
}

const config = {
    type: Phaser.AUTO,
    width: 800,
    height: 600,
    parent: 'phaser-example',
    scene:[MainMenu, MainGame]
};
new Phaser.Game(config);

</script>
</body>
</html>
