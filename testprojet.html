<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Emoji Match - Multi-Level</title>
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #fffae5, #ffb3ba);
  display: flex;
  flex-direction: column;
  align-items: center;
}
h1 {
  color: #333;
  margin-top: 20px;
  text-align: center;
}
#game-container {
  margin-top: 20px;
}
button {
  padding: 10px 20px;
  font-size: 24px;
  margin-top: 20px;
  cursor: pointer;
  border: none;
  border-radius: 8px;
  background: #ffd700;
  color: #333;
}
button:hover {
  background: #ffa500;
}
</style>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.min.js"></script>
</head>
<body>
<h1>🎉 Emoji Match Multi-Level 🎉</h1>
<div id="game-container"></div>

<script>
let config = {
    type: Phaser.AUTO,
    width: 800,
    height: 600,
    parent: 'game-container',
    scene: { preload, create, update }
};

let game = new Phaser.Game(config);

let cards = [], firstCard = null, canClick = true;
let matches = 0, scoreText, timerText;
let timerEvent;
let level = 1;
let emojis = ['😀','😎','🎯','🎲','🕹️','🤖','🐶','🍕','🍔','🌈','⭐','🍩','⚡','💎','🎵','🍉'];
let gridConfig = {1:{cols:4, rows:4},2:{cols:5, rows:4}};
let totalPairs;

function preload(){}

function create() {
    startLevel(this, level);
}

function startLevel(scene, lvl){
    scene.children.removeAll();
    cards=[]; firstCard=null; matches=0; canClick=true;

    let cols = gridConfig[lvl].cols;
    let rows = gridConfig[lvl].rows;
    totalPairs = Math.min(emojis.length, Math.floor(cols*rows/2));

    scoreText = scene.add.text(20,20,'Found: 0',{fontSize:'28px',color:'#333'});
    timerText = scene.add.text(650,20,'60',{fontSize:'28px',color:'#333'});

    // Timer 60s
    timerEvent = scene.time.addEvent({delay:60000, callback:timeOver, callbackScope:scene});

    // Prepare deck
    let deck = emojis.slice(0,totalPairs);
    deck = [...deck,...deck];
    Phaser.Utils.Array.Shuffle(deck);

    let spacingX = 120, spacingY = 120;
    let startX = (800 - spacingX*cols)/2 + spacingX/2;
    let startY = 120;

    for(let i=0;i<cols*rows;i++){
        let x = startX + (i%cols)*spacingX;
        let y = startY + Math.floor(i/cols)*spacingY;
        let card = scene.add.text(x,y,'❓',{fontSize:'64px',backgroundColor:'#fff',padding:{x:10,y:10},align:'center'}).setOrigin(0.5).setInteractive();
        card.emoji = deck[i];
        card.revealed = false;

        let circle = scene.add.circle(x,y,45,0xffffff,0).setStrokeStyle(3,0xf8960e);
        circle.setVisible(false);
        card.circle = circle;

        cards.push(card);
    }

    scene.input.on('gameobjectdown', function(pointer, card){
        if(!canClick || card.revealed) return;
        revealCard(card);
    });
}

function revealCard(card){
    card.setText(card.emoji);
    card.revealed = true;
    card.circle.setVisible(true);

    if(!firstCard){
        firstCard = card;
    } else {
        canClick=false;
        if(firstCard.emoji === card.emoji){
            beepGood();
            matches++;
            scoreText.setText('Found: '+matches);
            firstCard.circle.setStrokeStyle(3,0x00ff00);
            card.circle.setStrokeStyle(3,0x00ff00);
            setTimeout(()=>{firstCard=null; canClick=true; checkLevelComplete();},500);
        } else {
            beepBad();
            setTimeout(()=>{
                firstCard.setText('❓'); firstCard.revealed=false; firstCard.circle.setVisible(false);
                card.setText('❓'); card.revealed=false; card.circle.setVisible(false);
                firstCard=null; canClick=true;
            },600);
        }
    }
}

function update(){
    if(timerEvent){
        const remaining=(60-timerEvent.getElapsedSeconds()).toFixed(0);
        timerText.setText(remaining.padStart(2,'0'));
    }
}

function timeOver(){
    let scene = game.scene.scenes[0];
    canClick=false;
    let btn = scene.add.text(400,550,'Start Again',{fontSize:'28px',color:'#333',backgroundColor:'#ffd700',padding:{x:10,y:10}}).setOrigin(0.5).setInteractive();
    btn.on('pointerdown',()=>startLevel(scene,level));
}

function checkLevelComplete(){
    if(matches >= totalPairs){
        let scene = game.scene.scenes[0];
        canClick=false;
        if(level<2){
            let btn = scene.add.text(400,550,'Next Level',{fontSize:'28px',color:'#333',backgroundColor:'#ffd700',padding:{x:10,y:10}}).setOrigin(0.5).setInteractive();
            btn.on('pointerdown',()=>{
                level++;
                startLevel(scene,level);
            });
        } else {
            let btn = scene.add.text(400,550,'You Won! Restart',{fontSize:'28px',color:'#333',backgroundColor:'#ffd700',padding:{x:10,y:10}}).setOrigin(0.5).setInteractive();
            btn.on('pointerdown',()=>startLevel(scene,level));
        }
    }
}

// Sons générés Web Audio
function beepGood(){
    let ctx = new (window.AudioContext||window.webkitAudioContext)();
    let o = ctx.createOscillator();
    let g = ctx.createGain();
    o.type='square';
    o.frequency.setValueAtTime(600,ctx.currentTime);
    o.connect(g); g.connect(ctx.destination);
    o.start(0); g.gain.exponentialRampToValueAtTime(0.00001, ctx.currentTime+0.1);
}

function beepBad(){
    let ctx = new (window.AudioContext||window.webkitAudioContext)();
    let o = ctx.createOscillator();
    let g = ctx.createGain();
    o.type='square';
    o.frequency.setValueAtTime(200,ctx.currentTime);
    o.connect(g); g.connect(ctx.destination);
    o.start(0); g.gain.exponentialRampToValueAtTime(0.00001, ctx.currentTime+0.2);
}
</script>
</body>
</html>
