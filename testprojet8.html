<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>🎮 Emoji Match 🎮</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.min.js"></script>
<style>
  body { margin: 0; background: #1A1A1A; display:flex; justify-content:center; align-items:center; height:100vh;}
  canvas { border: 2px solid #FFF; cursor: default;}
</style>
</head>
<body>

<script>
// -------------------------
// THEMES
// -------------------------
const THEMES = {
  emoji: ['😀','😎','😍','😂','🥰','😜','🤩','😇','😱','🤪','🤓','🤑','🥳','😏','🤠','🤖'],
  animals: ['🐶','🐱','🦁','🐯','🐭','🐹','🐰','🐻','🐼','🐨','🐸','🐵','🐔','🦊','🐴','🦄'],
  fruits: ['🍎','🍌','🍇','🍉','🍓','🍒','🍑','🍍','🥝','🥥','🍐','🍊','🥕','🍅','🥦','🌽'],
  sport: ['⚽','🏀','🏈','⚾','🎾','🏓','🏒','🥊','🎱','🤿','🥋','⛷️','🏄','🚴','⛳','🥅']
};

let selectedTheme = "emoji";
let nightMode = false;

// -------------------------
// Niveaux
// -------------------------
const levels = [
  { time: 60, pairs: 8 },
  { time: 90, pairs: 12 },
  { time: 120, pairs: 15 }
];

// -------------------------
// Boutons
// -------------------------
function createButton(scene, x, y, text, color, bgColor, callback, fontSize='28px'){
  const container = scene.add.container(x, y);
  const rect = scene.add.rectangle(0,0,250,60,bgColor,0.9).setStrokeStyle(3,0xFFFFFF);
  const btnText = scene.add.text(0,0,text,{fontSize:fontSize,fontStyle:'bold',color:color}).setOrigin(0.5);
  container.add([rect,btnText]);
  container.setSize(rect.width, rect.height);
  container.setInteractive({useHandCursor:true})
           .on('pointerdown', ()=>{ callback(); })
           .on('pointerover', ()=>scene.tweens.add({targets:container,scale:1.05,duration:150,yoyo:true}))
           .on('pointerout', ()=>container.setScale(1));
  return container;
}

// -------------------------
// Preload
// -------------------------
class PreloadScene extends Phaser.Scene {
  constructor(){ super('PreloadScene'); }
  preload(){
    this.load.audio('click','https://actions.google.com/sounds/v1/cartoon/pop.ogg');
    this.load.audio('match','https://actions.google.com/sounds/v1/cartoon/wood_plank_flicks.ogg');
    this.load.audio('bgMusic','https://wafa258.github.io/cv/xmas.mp3');
  }
  create(){ this.scene.start('MainMenu'); }
}

// -------------------------
// MENU
// -------------------------
class MainMenu extends Phaser.Scene {
  constructor(){ super('MainMenu'); }

  create(){
    this.add.rectangle(450,300,900,600,0x1A1AFF); // bleu néon
    this.add.text(450,100,'🎮 Emoji Match 🎮',{fontSize:'36px',color:'#FFFF00',fontStyle:'bold'}).setOrigin(0.5);
    this.add.text(450,160,'Choose your theme :',{fontSize:'28px',color:'#00FFAA'}).setOrigin(0.5);

    this.themeButtons = [];

    const selectTheme = (themeName, btn) => {
      selectedTheme = themeName;
      this.themeButtons.forEach(b => b.getAt(0).setFillStyle(0xFF00FF)); // rose néon
      btn.getAt(0).setFillStyle(0xFFFFFF);
    };

    let btnEmoji = createButton(this, 250, 230, 'Emoji 😎', '#FFFFFF', 0xFF00FF, ()=>selectTheme('emoji', btnEmoji));
    this.themeButtons.push(btnEmoji);

    let btnAnimals = createButton(this, 650, 230, 'Animaux 🐶', '#FFFFFF', 0x00FFFF, ()=>selectTheme('animals', btnAnimals));
    this.themeButtons.push(btnAnimals);

    let btnFruits = createButton(this, 250, 320, 'Fruits 🍎', '#FFFFFF', 0xFFA500, ()=>selectTheme('fruits', btnFruits));
    this.themeButtons.push(btnFruits);

    let btnSport = createButton(this, 650, 320, 'Sport ⚽', '#FFFFFF', 0xFF0000, ()=>selectTheme('sport', btnSport));
    this.themeButtons.push(btnSport);

    selectTheme('emoji', btnEmoji);

    createButton(this,450,450,'Start Level 1','#FFFFFF',0x00FF00,()=>{ 
      this.scene.start('MainGame',{level:1, theme:selectedTheme}); 
    });
  }
}

// -------------------------
// TRANSITION NIVEAU
// -------------------------
class LevelTransition extends Phaser.Scene {
  constructor(){ super('LevelTransition'); }
  init(data){ this.nextLevel = data.level || 2; }
  create(){
    this.add.rectangle(450,300,900,600,0xFF69B4); // rose punchy
    this.add.text(450,180,'Félicitations🥳',{fontSize:'44px',color:'#00FFFF',fontStyle:'bold'}).setOrigin(0.5);
    this.add.text(450,250,'Jouez au niveau '+this.nextLevel+' !',{fontSize:'28px',color:'#FFFF00',fontStyle:'bold'}).setOrigin(0.5);
    createButton(this,450,350,'Level '+this.nextLevel,'#FFFFFF',0xFF6347,()=>{ 
      this.scene.start('MainGame',{level:this.nextLevel, theme:selectedTheme}); 
    });
  }
}

// -------------------------
// SCENE DE JEU
// -------------------------
class MainGame extends Phaser.Scene {
  constructor(){ super('MainGame'); }
  init(data){
    this.level = data.level || 1;
    this.theme = data.theme || "emoji";
  }

  create(){
    let bgColor;
    switch(this.theme){
        case 'emoji': bgColor = 0xFF69B4; break; // rose punchy
        case 'animals': bgColor = 0x7FFF00; break; // vert vif
        case 'fruits': bgColor = 0xFFA500; break; // orange saturé
        case 'sport': bgColor = 0x00FFFF; break; // cyan néon
    }
    this.background = this.add.rectangle(450,300,900,600,bgColor);

    let themeIcons = { emoji:'😎', animals:'🐶', fruits:'🍎', sport:'⚽'};
    this.add.text(450,70, themeIcons[this.theme], {fontSize:'48px'}).setOrigin(0.5);

    this.moonIcon = this.add.text(850, 90, nightMode ? '🌙' : '⛱️', {fontSize:'36px', color:'#FFFF00'}).setOrigin(0.5, 0.5);
    this.moonIcon.setInteractive({ useHandCursor: true })
    .on('pointerover', () => this.moonIcon.setScale(1.1))
    .on('pointerout', () => this.moonIcon.setScale(1));

    this.moonIcon.on('pointerdown', () => { 
        nightMode = !nightMode;  
        this.updateNightMode();  
        this.moonIcon.setText(nightMode ? '🌙' : '⛱️');  
    });

    const levelData = levels[this.level-1] || levels[0];
    this.timeLeft = levelData.time;
    this.pairs = levelData.pairs;
    this.score = 0;
    this.matched = 0;
    this.selected = null;

    this.timerText = this.add.text(20,20,'⏳ Time: '+this.timeLeft,{fontSize:'36px',color:'#FF00FF',fontStyle:'bold'}); 
    this.scoreText = this.add.text(700,20,'Found: '+this.score,{fontSize:'36px',color:'#FFFF00',fontStyle:'bold'}); 

    this.emojis = THEMES[this.theme];
    let cardEmojis=[];
    for(let i=0;i<this.pairs;i++){
      cardEmojis.push(this.emojis[i % this.emojis.length]);
      cardEmojis.push(this.emojis[i % this.emojis.length]);
    }
    Phaser.Utils.Array.Shuffle(cardEmojis);

    const bottomY = 550;
    this.musicIcon = this.add.text(850, bottomY, '🔊', {fontSize:'40px', color:'#FF00FF'}).setOrigin(0.5).setInteractive();
    this.musicIcon.on('pointerdown', ()=>{
        this.sound.unlock();
        if(!this.game.bgMusic){
            this.game.bgMusic = this.sound.add('bgMusic',{loop:true,volume:0.4});
            this.game.bgMusic.play();
            this.musicIcon.setText('🔊');  
        } else {
            if(this.game.bgMusic.isPlaying){
                this.game.bgMusic.pause();
                this.musicIcon.setText('🔇');  
            } else {
                this.game.bgMusic.resume();
                this.musicIcon.setText('🔊');  
            }
        }
    });

    this.pauseText = this.add.text(50,bottomY,'⏸️',{fontSize:'40px',color:'#FF00FF'}).setOrigin(0.5).setInteractive();

    [this.musicIcon, this.pauseText, this.moonIcon].forEach(icon => {
      icon.setInteractive({ useHandCursor: true })
          .on('pointerover', () => icon.setScale(1.1))
          .on('pointerout', () => icon.setScale(1));
    });

    this.cards=[];
    const cols = this.level===1?4:5;
    const spacingX = 100;
    const spacingY = 100;
    const canvasWidth = 900;
    const startX = this.level===1 ? (canvasWidth - (cols-1)*spacingX)/2 : 200;
    const startY = 160;

    for(let i=0;i<cardEmojis.length;i++){
      const row = Math.floor(i/cols);
      const col = i % cols;
      const x = startX + col*spacingX;
      const y = startY + row*spacingY;

      const card = this.add.text(x,y,'❓',{fontSize:'64px',fontFamily:'Arial',color:'#FFFFFF'}).setOrigin(0.5).setInteractive();
      card.emoji = cardEmojis[i];
      card.revealed = false;

      card.on('pointerdown',()=>{ 
        this.flipCard(card);
      });

      this.cards.push(card);
    }

    this.clignotementTween = null;
    this.timerEvent=this.time.addEvent({
      delay:1000,
      loop:true,
      callback:()=>{
        this.timeLeft--;
        this.timerText.setText('⏳ Time: '+this.timeLeft);

        if(this.timeLeft === 10){
          this.timerText.setColor('#FF0000');
          this.clignotementTween = this.tweens.add({
            targets:this.timerText,
            alpha:0,
            duration:250,
            yoyo:true,
            repeat:-1
          });
        }

        if(this.timeLeft <= 0) this.endGame();
      }
    });
  }

  updateNightMode(){
    if(nightMode){
      this.background.setFillStyle(0x111111);
      this.cards.forEach(c => c.setColor('#00FFFF'));
      this.timerText.setColor('#FF00FF');
      this.scoreText.setColor('#FFFF00');
    } else {
      let bgColor;
      switch(this.theme){
          case 'emoji': bgColor = 0xFF69B4; break;
          case 'animals': bgColor = 0x7FFF00; break;
          case 'fruits': bgColor = 0xFFA500; break;
          case 'sport': bgColor = 0x00FFFF; break;
      }
      this.background.setFillStyle(bgColor);
      this.cards.forEach(c => c.setColor('#FFFFFF'));
      this.timerText.setColor('#FF00FF');
      this.scoreText.setColor('#FFFF00');
    }
  }

  flipCard(card){
    if(card.revealed || this.selected===card) return;

    this.tweens.add({
      targets: card,
      scaleX: 0,
      duration: 150,
      onComplete: ()=>{ card.setText(card.emoji); card.revealed = true;
        this.tweens.add({targets: card, scaleX:1, duration:150});
      }
    });

    if(!this.selected){
      this.selected = card;
    } else {
      if(this.selected.emoji === card.emoji){
        this.sound.play('match');
        this.matched++;
        this.score++;
        this.scoreText.setText('Found: '+this.score);
        this.tweens.add({ targets: [this.selected, card], scale: 1.3, duration: 150, yoyo: true });
        this.selected = null;
        if(this.matched === this.cards.length/2) this.endLevel();
      } else {
        const first = this.selected;
        this.selected = null;
        this.sound.play('click');
        this.time.delayedCall(700, ()=>{
          [first, card].forEach(c=>{
            this.tweens.add({
              targets: c,
              scaleX:0,
              duration:150,
              onComplete: ()=>{ c.setText('❓'); c.revealed=false; this.tweens.add({targets:c, scaleX:1, duration:150}); }
            });
          });
        });
      }
    }
  }

  endLevel(){
    this.time.delayedCall(600,()=>{
      if(this.level < levels.length)
        this.scene.start('LevelTransition',{level:this.level+1});
      else
        this.endGame(true);
    });
  }

  endGame(win=false){
    if(this.clignotementTween) this.clignotementTween.stop();
    this.timerEvent.remove();
    this.add.rectangle(450,300,900,600,0x000000,0.5);
    this.add.text(450,180,win?'Level Complete!':'Time Over!',{fontSize:'44px',color:'#FFFF00',fontStyle:'bold'}).setOrigin(0.5);
    createButton(this,450,280,'Restart','#FFFFFF',0xFF6347,()=>{ 
      this.scene.start('MainMenu'); 
    });
  }
}

class PauseScene extends Phaser.Scene{
  constructor(){ super('PauseScene'); }
  init(data){ this.parent=data.parent; }
  create(){
    this.add.rectangle(450,300,900,600,0x000000,0.5);
    this.add.text(450,180,'Paused',{fontSize:'44px',color:'#FFFF00',fontStyle:'bold'}).setOrigin(0.5);
    createButton(this,450,300,'▶ Resume','#FFFFFF',0xFF00FF,()=>{ 
      this.scene.stop(); 
      this.parent.scene.resume(); 
    },'32px');
  }
}

const config={ type: Phaser.AUTO, width:900, height:600, scene:[PreloadScene,MainMenu,LevelTransition,MainGame,PauseScene] };
new Phaser.Game(config);

</script>

</body>
</html>
