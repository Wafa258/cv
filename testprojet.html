<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Emoji Match</title>
<style>
body {
  margin: 0;
  font-family: Arial;
  background: linear-gradient(135deg, #fffae5, #ffb3ba);
  display: flex;
  flex-direction: column;
  align-items: center;
}
h1 {
  color: #333;
  margin-top: 20px;
  text-align: center;
}
#game-container {
  margin-top: 20px;
}
</style>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.min.js"></script>
</head>
<body>
<h1>🎉 Emoji Match 🎉</h1>
<div id="game-container"></div>

<script>
let config = {
    type: Phaser.AUTO,
    width: 800,
    height: 600,
    parent: 'game-container',
    scene: {
        preload: preload,
        create: create,
        update: update
    }
};

let game = new Phaser.Game(config);
let cards = [];
let firstCard = null;
let canClick = true;
let matches = 0;
let scoreText, timerText;
let timerEvent;
let emojis = ['😀','😎','🎯','🎲','🕹️','🤖','🐶','🍕'];

function preload() {}

function create() {
    scoreText = this.add.text(20,20,'Found: 0',{fontSize:'28px',color:'#333'});
    timerText = this.add.text(650,20,'30',{fontSize:'28px',color:'#333'});

    // Créer la grille 4x4
    let deck = [...emojis,...emojis];
    Phaser.Utils.Array.Shuffle(deck);

    let startX = 200, startY = 150, spacing = 120;

    for(let i=0;i<16;i++){
        let x = startX + (i%4)*spacing;
        let y = startY + Math.floor(i/4)*spacing;
        let card = this.add.text(x,y,'❓',{fontSize:'64px',backgroundColor:'#fff',padding:{x:10,y:10},align:'center'}).setOrigin(0.5).setInteractive();
        card.emoji = deck[i];
        card.revealed = false;
        cards.push(card);

        let circle = this.add.circle(x,y,45,0xffffff,0).setStrokeStyle(3,0xf8960e);
        circle.setVisible(false);
        card.circle = circle;
    }

    this.input.on('gameobjectdown', function(pointer, card){
        if(!canClick || card.revealed) return;

        card.setText(card.emoji);
        card.revealed = true;
        card.circle.setVisible(true);

        if(!firstCard){
            firstCard = card;
        } else {
            canClick=false;
            if(firstCard.emoji === card.emoji){
                beep();
                matches++;
                scoreText.setText('Found: '+matches);
                firstCard.circle.setStrokeStyle(3,0x00ff00);
                card.circle.setStrokeStyle(3,0x00ff00);
                setTimeout(()=>{firstCard=null; canClick=true;},500);
            } else {
                setTimeout(()=>{
                    firstCard.setText('❓'); firstCard.revealed=false; firstCard.circle.setVisible(false);
                    card.setText('❓'); card.revealed=false; card.circle.setVisible(false);
                    firstCard=null; canClick=true;
                },600);
            }
        }
    });

    // Timer 30s
    timerEvent = this.time.addEvent({delay:30000, callback:gameOver, callbackScope:this});
}

// Générer un petit bip sans fichier audio
function beep(){
    let ctx = new (window.AudioContext||window.webkitAudioContext)();
    let o = ctx.createOscillator();
    let g = ctx.createGain();
    o.type='square';
    o.connect(g);
    g.connect(ctx.destination);
    o.start(0);
    g.gain.exponentialRampToValueAtTime(0.00001, ctx.currentTime+0.1);
}

function update(){
    if(timerEvent){
        const remaining=(30-timerEvent.getElapsedSeconds()).toFixed(0);
        timerText.setText(remaining.padStart(2,'0'));
    }
}

function gameOver(){
    game.scene.scenes[0].input.off('gameobjectdown');
    let scene = game.scene.scenes[0];
    scene.add.text(400,550,'Game Over! Click to Restart',{fontSize:'28px',color:'#333'}).setOrigin(0.5).setInteractive().on('pointerdown',()=>{
        game.scene.restart();
        cards=[]; firstCard=null; matches=0; canClick=true;
    });
}
</script>
</body>
</html>
