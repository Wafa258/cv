<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>🎮 Emoji Match 🎮</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.min.js"></script>

<style>
    body {
        margin: 0;
        background: #f0f8ff;
    }
    canvas {
        display: block;
        margin: 0 auto;
        border: 2px solid #000;
    }
</style>
</head>
<body>

<script>
class MainMenu extends Phaser.Scene {
    constructor() { super('MainMenu'); }

    preload() {
        this.load.audio('click', 'https://actions.google.com/sounds/v1/cartoon/wood_plank_flicks.ogg');
        this.load.audio('bgmusic', 'https://cdn.pixabay.com/audio/2022/03/15/audio_35fc9da8f6.mp3');
    }

    create() {
        // Fond violet
        this.add.rectangle(400, 300, 800, 600, 0x8A2BE2);

        // Titre
        this.add.text(400, 150, '🎮 Emoji Match 🎮', {
            fontSize: '40px',
            color: '#fff',
            fontStyle: 'bold'
        }).setOrigin(0.5);

        // Musique
        if (!this.bgmusic) {
            this.bgmusic = this.sound.add('bgmusic', { loop: true, volume: 0.3 });
            this.bgmusic.play();
        }

        // Bouton START
        const btn = this.add.rectangle(400, 400, 300, 70, 0xFF6347).setInteractive({ useHandCursor: true });
        const btnText = this.add.text(400, 400, 'Start Level 1', {
            fontSize: '32px',
            color: '#fff',
            fontStyle: 'bold'
        }).setOrigin(0.5);

        // Mettre le bouton au-dessus du reste
        btn.setDepth(1);
        btnText.setDepth(2);

        // Hover
        btn.on('pointerover', ()=> btn.setFillStyle(0xFF4500));
        btn.on('pointerout', ()=> btn.setFillStyle(0xFF6347));

        // Click
        btn.on('pointerdown', () => {
            this.sound.play('click');
            this.scene.start('MainGame', { level: 1 });
        });
    }
}

class MainGame extends Phaser.Scene {
    constructor() { super('MainGame'); }
    init(data){ this.level = data.level || 1; }

    preload(){
        this.load.audio('click','https://actions.google.com/sounds/v1/cartoon/wood_plank_flicks.ogg');
        this.load.audio('match','https://actions.google.com/sounds/v1/cartoon/pop.ogg');
    }

    create(){
        // Fond jaune
        this.add.rectangle(400, 300, 800, 600, 0xFFFFE0);

        this.score = 0;
        this.timeLeft = this.level === 1 ? 60 : 90;
        this.pairs = this.level === 1 ? 8 : 12;

        this.timerText = this.add.text(20,20,'Time: '+this.timeLeft,{fontSize:'32px'});
        this.scoreText = this.add.text(550,20,'Found: '+this.score,{fontSize:'32px'});

        // Emojis
        this.emojis=['😀','😎','😍','😂','🥰','😜','🤩','😇','😱','🤪','🤓','🤑','🥳','😏','🤠','🤖'];
        let list=[];
        for(let i=0;i<this.pairs;i++){
            list.push(this.emojis[i]);
            list.push(this.emojis[i]);
        }
        Phaser.Utils.Array.Shuffle(list);

        // Création cartes
        this.cards=[];
        this.selected=null;
        this.matched=0;
        const cols=4, startX=200, startY=150, spX=120, spY=120;
        for(let i=0;i<list.length;i++){
            const row = Math.floor(i/cols), col = i%cols;
            const card = this.add.text(startX+col*spX, startY+row*spY+5, '❓', {
                fontSize:'58px',
                fontFamily:'Arial',
                padding:{top:10,bottom:10}
            }).setOrigin(0.5).setInteractive();
            card.emoji = list[i];
            card.on('pointerdown', ()=> this.revealCard(card));
            this.cards.push(card);
        }

        // Timer
        this.timerEvent = this.time.addEvent({
            delay:1000,
            loop:true,
            callback: ()=>{
                this.timeLeft--;
                this.timerText.setText('Time: '+this.timeLeft);
                if(this.timeLeft <= 0) this.endGame();
            }
        });
    }

    revealCard(card){
        if(this.selected===card || card.revealed) return;
        card.setText(card.emoji);

        if(!this.selected){
            this.selected=card;
        } else {
            if(this.selected.emoji===card.emoji){
                this.sound.play('click');
                this.selected=null;
                this.score++;
                this.scoreText.setText('Found: '+this.score);
                this.matched++;
            } else {
                const first=this.selected;
                this.selected=null;
                this.time.delayedCall(800, ()=>{
                    first.setText('❓');
                    card.setText('❓');
                });
                this.sound.play('match');
            }
        }
    }

    endGame(){
        this.timerEvent.remove();
        this.add.text(400,300,'Game Over',{fontSize:'48px', color:'#fff'}).setOrigin(0.5);
    }
}

const config={
    type: Phaser.AUTO,
    width:800,
    height:600,
    scene:[MainMenu, MainGame]
};

new Phaser.Game(config);
</script>
</body>
</html>
