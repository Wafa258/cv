<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Emoji Match</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.min.js"></script>
<style>
    body { margin: 0; background: #f0f8ff; display: flex; justify-content: center; align-items: center; height: 100vh; }
    canvas { border: 2px solid #000; }
</style>
</head>
<body>

<script>
// ----------- SCENES ------------
class Boot extends Phaser.Scene {
    constructor() { super('Boot'); }
    create() { this.scene.start('Preloader'); }
}

class Preloader extends Phaser.Scene {
    constructor() { super('Preloader'); }
    preload() {
        // Text loading
        this.loadText = this.add.text(400, 300, 'Loading ...', { fontSize: '32px', color: '#333' }).setOrigin(0.5);
        // Load sound (libre de droit)
        this.load.audio('click', ['https://actions.google.com/sounds/v1/cartoon/wood_plank_flicks.ogg']);
        this.load.audio('match', ['https://actions.google.com/sounds/v1/cartoon/pop.ogg']);
    }
    create() { this.scene.start('MainMenu'); }
}

class MainMenu extends Phaser.Scene {
    constructor() { super('MainMenu'); }
    create() {
        // Fond joyeux
        this.add.rectangle(400, 300, 800, 600, 0x87CEFA); // bleu ciel

        // Titre
        this.add.text(400, 150, 'Emoji Match', {
            fontSize: '64px', color: '#FF4500', fontStyle: 'bold'
        }).setOrigin(0.5);

        // Bouton moderne
        const btnWidth = 300, btnHeight = 70;
        const btnBg = this.add.rectangle(400, 400, btnWidth, btnHeight, 0xFF6347).setOrigin(0.5).setInteractive({ useHandCursor: true });
        const btnText = this.add.text(400, 400, 'Start Level 1', { fontSize: '32px', color: '#FFF', fontStyle: 'bold' }).setOrigin(0.5);

        btnBg.on('pointerover', () => btnBg.setFillStyle(0xFF4500));
        btnBg.on('pointerout', () => btnBg.setFillStyle(0xFF6347));
        btnBg.on('pointerdown', () => {
            this.sound.play('click');
            this.scene.start('MainGame', { level: 1 });
        });
    }
}

class MainGame extends Phaser.Scene {
    constructor() { super('MainGame'); }
    init(data) { this.level = data.level || 1; }
    create() {
        // Fond du jeu
        this.add.rectangle(400, 300, 800, 600, 0xFFFFE0); // jaune clair

        // Timer et score
        this.timeLeft = (this.level === 1 ? 30 : 60); // plus de temps pour le niveau 2
        this.score = 0;

        this.timerText = this.add.text(20, 20, 'Time: ' + this.timeLeft, { fontSize: '32px', color: '#333', fontStyle: 'bold' });
        this.scoreText = this.add.text(550, 20, 'Found: ' + this.score, { fontSize: '32px', color: '#333', fontStyle: 'bold' });

        // Emojis à utiliser
        this.emojisArray = ['😀','😎','😍','😂','🥰','😜','🤩','😇'];
        this.pairs = this.level === 1 ? 8 : 12; // nombre de paires selon niveau

        // Créer tableau des cartes
        this.cards = [];
        let cardEmojis = [];
        for (let i=0;i<this.pairs;i++) { cardEmojis.push(this.emojisArray[i%this.emojisArray.length]); cardEmojis.push(this.emojisArray[i%this.emojisArray.length]); }
        Phaser.Utils.Array.Shuffle(cardEmojis);

        // Affichage cartes
        this.selected = null;
        this.matched = 0;
        const startX = 200, startY = 150;
        const spacingX = 100, spacingY = 100;
        for (let i=0;i<cardEmojis.length;i++) {
            const row = Math.floor(i/4);
            const col = i%4;
            const card = this.add.text(startX+col*spacingX, startY+row*spacingY, '❓', { fontSize: '64px' }).setOrigin(0.5).setInteractive();
            card.emoji = cardEmojis[i];
            card.revealed = false;
            card.on('pointerdown', () => this.revealCard(card));
            this.cards.push(card);
        }

        // Timer
        this.timerEvent = this.time.addEvent({
            delay: 1000,
            callback: () => {
                this.timeLeft--;
                this.timerText.setText('Time: ' + this.timeLeft);
                if (this.timeLeft<=0) this.endGame();
            },
            loop: true
        });
    }

    revealCard(card) {
        if (card.revealed || this.selected === card) return;
        card.setText(card.emoji);
        this.sound.play('match');
        if (!this.selected) {
            this.selected = card;
        } else {
            if (this.selected.emoji === card.emoji) {
                // Match
                this.selected = null;
                this.matched++;
                this.score++;
                this.scoreText.setText('Found: ' + this.score);
                if (this.matched === this.cards.length/2) {
                    this.endGame(true);
                }
            } else {
                // Non match
                const first = this.selected;
                this.selected = null;
                this.time.delayedCall(800, () => { first.setText('❓'); card.setText('❓'); }, [], this);
            }
        }
    }

    endGame(win=false) {
        this.timerEvent.remove();
        // Overlay fond
        const overlay = this.add.rectangle(400,300,800,600,0x000000,0.5);
        const msg = win ? 'Level Complete!' : 'Time Over!';
        const msgText = this.add.text(400,250,msg,{fontSize:'48px',color:'#FFF',fontStyle:'bold'}).setOrigin(0.5);

        // Bouton restart
        const btnBg = this.add.rectangle(400, 350, 300, 70, 0xFF6347).setOrigin(0.5).setInteractive({useHandCursor:true});
        const btnText = this.add.text(400,350,'Restart',{fontSize:'32px',color:'#FFF',fontStyle:'bold'}).setOrigin(0.5);
        btnBg.on('pointerover',()=>btnBg.setFillStyle(0xFF4500));
        btnBg.on('pointerout',()=>btnBg.setFillStyle(0xFF6347));
        btnBg.on('pointerdown', ()=>{ this.scene.start('MainMenu'); this.sound.play('click'); });
    }
}

// ----------- CONFIG ------------
const config = {
    type: Phaser.AUTO,
    width: 800,
    height: 600,
    parent: null,
    scene: [Boot, Preloader, MainMenu, MainGame]
};

// ----------- GAME ------------
new Phaser.Game(config);
</script>
</body>
</html>
