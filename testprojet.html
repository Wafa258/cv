<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Emoji Match Game</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.js"></script>
</head>
<body>
<script>
class Boot extends Phaser.Scene {
    constructor() { super('Boot'); }
    create() { this.scene.start('Preloader'); }
}

class Preloader extends Phaser.Scene {
    constructor() { super('Preloader'); }
    preload() {
        this.load.audio('bgMusic', 'https://freesound.org/data/previews/522/522180_8284181-lq.mp3');
    }
    create() { this.scene.start('MainMenu'); }
}

class MainMenu extends Phaser.Scene {
    constructor() { super('MainMenu'); }
    create() {
        // Fond dégradé
        let bg = this.add.rectangle(400, 300, 800, 600, 0xffffff);
        let grd = this.add.graphics();
        grd.fillGradientStyle(0xFFCC66,0xFF6699,0x66CCFF,0x66FF66,1);
        grd.fillRect(0,0,800,600);

        // Titre
        this.add.text(400, 150, "Emoji Match!", { font: "60px Arial", color: "#333" }).setOrigin(0.5);

        // Bouton Start Level 1
        let startBtn = this.add.text(400, 350, "Start Level 1", { font: "40px Arial", backgroundColor: "#ffcc00", color: "#333", padding: {x:20,y:10}, align:"center" })
            .setOrigin(0.5)
            .setInteractive({ useHandCursor: true })
            .on('pointerdown', () => this.scene.start('MainGame',{level:1}));
    }
}

class MainGame extends Phaser.Scene {
    constructor() { super('MainGame'); }
    init(data){ this.level = data.level || 1; }
    create() {
        // Fond dégradé joyeux
        let grd = this.add.graphics();
        grd.fillGradientStyle(0xFFEEAA, 0xFFCCFF, 0x99CCFF, 0x99FF99, 1);
        grd.fillRect(0,0,800,600);

        // Musique douce
        if(!this.bgMusic) {
            this.bgMusic = this.sound.add('bgMusic',{ loop:true, volume:0.3 });
            this.bgMusic.play();
        }

        // Score et timer
        this.score = 0;
        this.foundText = this.add.text(50,20,"Found: 0", { font:"32px Arial", color:"#333" });
        this.timerText = this.add.text(600,20,"", { font:"32px Arial", color:"#333" });

        // Temps selon le niveau
        this.timeLeft = this.level===1 ? 45 : 75;

        // Emojis Unicode
        this.emojis = ['😀','😂','😍','🥰','😎','🤩','🤪','😇','😜','🤓','🧐','😱','😴','🤤','😈','👻'];
        if(this.level===2){ this.emojis.push('😺','😹','😻','😼'); } // Plus d'emojis niveau 2

        Phaser.Utils.Array.Shuffle(this.emojis);

        // Créer un tableau 4x4
        this.cards = [];
        let positions = [];
        for(let row=0; row<4; row++){
            for(let col=0; col<4; col++){
                positions.push({x:200+col*100, y:150+row*100});
            }
        }

        Phaser.Utils.Array.Shuffle(positions);

        this.selected = null;
        this.matchedPairs = 0;

        for(let i=0;i<16;i++){
            let pos = positions[i];
            let card = this.add.text(pos.x,pos.y,'❓',{ font:"64px Arial", color:"#333" }).setOrigin(0.5).setInteractive();
            card.emoji = this.emojis[i];
            card.revealed = false;
            card.on('pointerdown',()=>this.revealCard(card));
            this.cards.push(card);
        }

        // Timer
        this.timerEvent = this.time.addEvent({
            delay: this.timeLeft*1000,
            callback: this.timeUp,
            callbackScope: this
        });
        this.time.addEvent({
            delay: 100,
            loop:true,
            callback:()=>this.timerText.setText(`Time: ${Math.ceil(this.timeLeft-this.timerEvent.getElapsedSeconds())}`)
        });
    }

    revealCard(card){
        if(card.revealed) return;
        card.setText(card.emoji);
        card.revealed = true;

        if(!this.selected){
            this.selected = card;
        }else{
            if(this.selected.emoji===card.emoji){
                // Match
                this.score++;
                this.foundText.setText(`Found: ${this.score}`);
                this.selected = null;
                this.matchedPairs++;
                if(this.matchedPairs===8){
                    if(this.level===1){
                        this.showLevelUp();
                    }else{
                        this.showWin();
                    }
                }
            }else{
                let prev = this.selected;
                this.selected = null;
                this.time.delayedCall(800, ()=>{
                    card.setText('❓'); card.revealed=false;
                    prev.setText('❓'); prev.revealed=false;
                });
            }
        }
    }

    timeUp(){
        this.add.text(400,300,"Time's Up!",{font:"50px Arial", color:"#ff0000"}).setOrigin(0.5);
        this.cards.forEach(c=>c.disableInteractive());
        let btn = this.add.text(400,400,"Restart",{font:"40px Arial", backgroundColor:"#00ccff", color:"#333", padding:{x:20,y:10}}).setOrigin(0.5).setInteractive()
            .on('pointerdown',()=>this.scene.start('MainMenu'));
    }

    showLevelUp(){
        this.add.text(400,300,"Félicitations! Level 2",{font:"50px Arial", color:"#ff00aa"}).setOrigin(0.5);
        let btn = this.add.text(400,400,"Start Level 2",{font:"40px Arial", backgroundColor:"#ffcc00", color:"#333", padding:{x:20,y:10}}).setOrigin(0.5).setInteractive()
            .on('pointerdown',()=>this.scene.start('MainGame',{level:2}));
    }

    showWin(){
        this.add.text(400,300,"🎉 Vous avez gagné! 🎉",{font:"50px Arial", color:"#33aa33"}).setOrigin(0.5);
        let btn = this.add.text(400,400,"Restart",{font:"40px Arial", backgroundColor:"#00ccff", color:"#333", padding:{x:20,y:10}}).setOrigin(0.5).setInteractive()
            .on('pointerdown',()=>this.scene.start('MainMenu'));
    }
}

const config = {
    type: Phaser.AUTO,
    width: 800,
    height: 600,
    scene:[Boot,Preloader,MainMenu,MainGame]
};

new Phaser.Game(config);
</script>
</body>
</html>
