<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>🎮 Emoji Match 🎮</title>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.min.js"></script>
  <style>
    body { margin: 0; background: #f0f8ff; }
    canvas { display: block; margin: 30px auto; border: 2px solid #000; }
  </style>
</head>
<body>

<script>
class MainMenu extends Phaser.Scene {
  constructor() { super('MainMenu'); }

  preload() {
    this.load.audio('click', 'https://actions.google.com/sounds/v1/cartoon/wood_plank_flicks.ogg');
  }

  create() {
    this.add.rectangle(400,300,800,600,0xE800F0);
    this.add.text(400, 150, '🎮 Emoji Match 🎮', { fontSize: '40px', color: '#FFF', fontStyle: 'bold' }).setOrigin(0.5);

    const btn = this.add.rectangle(400, 400, 300, 70, 0xF2509B).setInteractive({ useHandCursor: true });
    const btnText = this.add.text(400, 400, 'Start Level 1', { fontSize: '32px', color: '#FFF', fontStyle: 'bold' }).setOrigin(0.5);

    this.makeButtonInteractive(btn, btnText);

    btn.on('pointerdown', () => {
      this.sound.play('click');
      this.scene.start('MainGame', { level: 1 });
    });
  }

  makeButtonInteractive(btn, btnText) {
    btn.on('pointerover', () => {
      this.tweens.add({
        targets: btn,
        scale: 1.1,
        duration: 200,
        yoyo: true,
        repeat: -1
      });
      btn.setStrokeStyle(3, 0xFFFF00);
    });
    btn.on('pointerout', () => {
      btn.setScale(1);
      btn.setStrokeStyle();
      btn.removeAllListeners('pointerover');
    });
  }
}

class LevelTransition extends Phaser.Scene {
  constructor(){ super('LevelTransition'); }
  init(data) { this.nextLevel = data.level || 2; }

  preload(){
    this.load.audio('click', 'https://actions.google.com/sounds/v1/cartoon/wood_plank_flicks.ogg');
  }

  create(){
    this.add.rectangle(400,300,800,600,0xEA5EF2);
    this.add.text(400,250,'Félicitations🥳​', { fontSize:'48px', color:'#FF4500', fontStyle:'bold' }).setOrigin(0.5);
    this.add.text(400,320,'Jouez au niveau '+this.nextLevel+' !', { fontSize:'32px', color:'#000', fontStyle:'bold' }).setOrigin(0.5);

    const btn = this.add.rectangle(400,400,300,70,0xFF6347).setInteractive({ useHandCursor: true });
    const txt = this.add.text(400,400,'Level '+this.nextLevel, { fontSize:'32px', color:'#FFF', fontStyle:'bold' }).setOrigin(0.5);

    this.makeButtonInteractive(btn, txt);

    btn.on('pointerdown', () => {
      this.sound.play('click');
      this.scene.start('MainGame', { level: this.nextLevel });
    });
  }

  makeButtonInteractive(btn, btnText) {
    btn.on('pointerover', () => {
      this.tweens.add({
        targets: btn,
        scale: 1.1,
        duration: 200,
        yoyo: true,
        repeat: -1
      });
      btn.setStrokeStyle(3, 0xFFFF00);
    });
    btn.on('pointerout', () => {
      btn.setScale(1);
      btn.setStrokeStyle();
      btn.removeAllListeners('pointerover');
    });
  }
}

class MainGame extends Phaser.Scene {
  constructor(){ super('MainGame'); }
  init(data){ this.level = data.level || 1; }

  preload(){
    this.load.audio('click', 'https://actions.google.com/sounds/v1/cartoon/wood_plank_flicks.ogg');
    this.load.audio('match', 'https://actions.google.com/sounds/v1/cartoon/pop.ogg');
    this.load.audio('bgMusic', 'https://wafa258.github.io/cv/xmas.mp3');
  }

  create(){
    this.add.rectangle(400,300,800,600,0xDDB8F2);

    this.score = 0;
    this.timeLeft = this.level === 1 ? 60 : 90;
    this.pairs = this.level === 1 ? 8 : 12;

    // Timer avec emoji dès le début
    this.timerText = this.add.text(20, 20, '⏳ Time: ' + this.timeLeft, { fontSize: '32px', color: '#333', fontStyle: 'bold' }).setDepth(5);
    this.scoreText = this.add.text(550, 20, 'Found: ' + this.score, { fontSize: '32px', color: '#333', fontStyle: 'bold' }).setDepth(5);

    this.emojis = ['😀','😎','😍','😂','🥰','😜','🤩','😇','😱','🤪','🤓','🤑','🥳','😏','🤠','🤖'];
    let cardEmojis = [];
    for (let i = 0; i < this.pairs; i++) {
      cardEmojis.push(this.emojis[i % this.emojis.length]);
      cardEmojis.push(this.emojis[i % this.emojis.length]);
    }
    Phaser.Utils.Array.Shuffle(cardEmojis);

    this.cards = [];
    this.selected = null;
    this.matched = 0;

    // 🔥 Centrer correctement le niveau 1
    const cols = this.level === 1 ? 4 : 5; 
    const spacingX = 100;
    const spacingY = 100;
    const canvasWidth = 800;
    const startX = this.level === 1 ? (canvasWidth - (cols - 1) * spacingX) / 2 : 200;
    const startY = 100;

    for (let i = 0; i < cardEmojis.length; i++) {
      const row = Math.floor(i / cols);
      const col = i % cols;

      const card = this.add.text(
        startX + col * spacingX,
        startY + row * spacingY + 5,
        '❓',
        { fontSize: '58px', fontFamily: 'Arial', padding: { top: 10, bottom: 10 } }
      ).setOrigin(0.5).setInteractive().setDepth(4);

      card.emoji = cardEmojis[i];
      card.revealed = false;
      card.on('pointerdown', () => this.revealCard(card));
      this.cards.push(card);
    }

    // Icône musique
    const musicIcon = this.add.text(750, 30, '🔊', { fontSize: '32px', color: '#333' })
      .setInteractive({ useHandCursor: true })
      .setOrigin(0.5)
      .setDepth(6);

    musicIcon.on('pointerdown', () => {
      this.sound.unlock();
      if (!this.game.bgMusic) {
        this.game.bgMusic = this.sound.add('bgMusic', { loop: true, volume: 0.4 });
        this.game.bgMusic.play();
      } else {
        if (this.game.bgMusic.isPlaying) this.game.bgMusic.pause();
        else this.game.bgMusic.resume();
      }
    });

    // Timer avec clignotement rapide et rouge quand <10s
    this.clignotementTween = null;
    this.timerEvent = this.time.addEvent({
      delay: 1000,
      loop: true,
      callback: () => {
        this.timeLeft--;
        this.timerText.setText('⏳ Time: ' + this.timeLeft);

        if (this.timeLeft === 10) {
          // rouge + clignotement rapide
          this.timerText.setColor('#FF0000');
          this.clignotementTween = this.tweens.add({
            targets: this.timerText,
            alpha: 0,
            duration: 250,
            yoyo: true,
            repeat: -1
          });
        }

        if (this.timeLeft <= 0) this.endGame();
      }
    });
  }

  revealCard(card){
    if (card.revealed || this.selected === card) return;
    card.setText(card.emoji);

    if (!this.selected) {
      this.selected = card;
    } else {
      if (this.selected.emoji === card.emoji) {
        this.selected = null;
        this.matched++;
        this.score++;
        this.scoreText.setText('Found: ' + this.score);
        this.sound.play('click');
        if (this.matched === this.cards.length / 2) {
          if (this.level === 1) this.scene.start('LevelTransition', { level: 2 });
          else this.endGame(true);
        }
      } else {
        const first = this.selected;
        this.selected = null;
        this.time.delayedCall(800, () => {
          first.setText('❓');
          card.setText('❓');
        }, [], this);
        this.sound.play('match');
      }
    }
  }

  endGame(win = false) {
    if (this.clignotementTween) this.clignotementTween.stop();
    this.timerEvent.remove();
    this.add.rectangle(400,300,800,600,0x000000,0.5);
    this.add.text(400,250, win ? 'Level Complete!' : 'Time Over!', { fontSize: '48px', color: '#FFF', fontStyle: 'bold' })
      .setOrigin(0.5).setDepth(10);

    const btnBg = this.add.rectangle(400,350,300,70,0xFF6347)
      .setInteractive({ useHandCursor: true })
      .setDepth(11);
    const btnText = this.add.text(400,350,'Restart', { fontSize: '32px', color: '#FFF', fontStyle: 'bold' })
      .setOrigin(0.5).setDepth(12);

    btnBg.on('pointerover', () => {
      this.tweens.add({
        targets: btnBg,
        scale: 1.1,
        duration: 200,
        yoyo: true,
        repeat: -1
      });
      btnBg.setStrokeStyle(3, 0xFFFF00);
    });
    btnBg.on('pointerout', () => {
      btnBg.setScale(1);
      btnBg.setStrokeStyle();
      btnBg.removeAllListeners('pointerover');
    });

    btnBg.on('pointerdown', () => {
      this.scene.start('MainMenu');
      this.sound.play('click');
    });
  }
}

const config = {
  type: Phaser.AUTO,
  width: 800,
  height: 600,
  scene: [MainMenu, LevelTransition, MainGame]
};

new Phaser.Game(config);
</script>

</body>
</html>
