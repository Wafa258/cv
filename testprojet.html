<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Emoji Match Game</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.min.js"></script>
<style>
  body {
    margin: 0;
    background: #f0f0f0;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: Arial, sans-serif;
  }
  #phaser-example {
    border: 5px solid #ffcc33;
    border-radius: 15px;
  }
  .btn {
    font-family: Arial, sans-serif;
    font-size: 28px;
    padding: 12px 24px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(45deg, #ff6ec4, #7873f5);
    color: #fff;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn:hover {
    transform: scale(1.1);
    background: linear-gradient(45deg, #ff9a9e, #fad0c4);
  }
</style>
</head>
<body>
<div id="phaser-example"></div>
<script>
class BootScene extends Phaser.Scene {
    constructor() { super('Boot'); }
    create() {
        this.registry.set('highscore', 0);
        this.scene.start('Preloader');
    }
}

class PreloaderScene extends Phaser.Scene {
    constructor() { super('Preloader'); }
    preload() {
        const width = this.cameras.main.width;
        const height = this.cameras.main.height;
        this.loadText = this.add.text(width/2, height/2, 'Loading...', { fontSize: '48px', color: '#000' }).setOrigin(0.5);
        // Sons libres de droit
        this.load.audio('match', 'https://freesound.org/data/previews/170/170152_2437358-lq.mp3');
        this.load.audio('bgm', 'https://freesound.org/data/previews/415/415209_5121236-lq.mp3');
    }
    create() {
        this.scene.start('MainMenu');
    }
}

class MainMenuScene extends Phaser.Scene {
    constructor() { super('MainMenu'); }
    create() {
        const width = this.cameras.main.width;
        const height = this.cameras.main.height;

        this.add.rectangle(width/2, height/2, width, height, 0x87cefa); // fond bleu

        this.add.text(width/2, 100, 'Emoji Match Game', { fontSize:'48px', color:'#000', fontStyle:'bold' }).setOrigin(0.5);

        const btn = this.add.dom(width/2, height/2).createFromHTML('<button class="btn">Start Level 1</button>');
        btn.addListener('click');
        btn.on('click', () => { 
            this.scene.start('GameScene', { level: 1 });
        });

        // musique douce
        this.bgm = this.sound.add('bgm', { loop:true, volume:0.2 });
        this.bgm.play();
    }
}

class GameScene extends Phaser.Scene {
    constructor() { super('GameScene'); }
    init(data) {
        this.level = data.level || 1;
    }
    create() {
        const width = this.cameras.main.width;
        const height = this.cameras.main.height;

        // fond dégradé joyeux
        const graphics = this.add.graphics();
        const gradient = graphics.createGradientTexture('bgGradient', width, height);
        graphics.fillGradientStyle(0xfff176, 0xff8a65, 0xffb74d, 0x81c784, 1);
        graphics.fillRect(0,0,width,height);

        this.add.rectangle(width/2, height/2, width, height, 0xffffff, 0.01); // placeholder pour layer

        // emojis pour ce niveau
        this.emojisList = ['😀','😂','😍','😎','😜','🤩','🥳','😇','😋','🤓','😏','🤗','😺','😸','😹','😻'];
        if(this.level===2) this.emojisList = this.emojisList.concat(['🦄','🐱','🐶','🌟']);

        this.pairs = Phaser.Utils.Array.Shuffle(this.emojisList.concat(this.emojisList));
        this.cards = [];

        const rows = 4;
        const cols = Math.ceil(this.pairs.length / rows);
        const spacing = 100;
        const startX = width/2 - (cols-1)*spacing/2;
        const startY = 200;

        for(let i=0;i<this.pairs.length;i++){
            const col = i % cols;
            const row = Math.floor(i / cols);
            const x = startX + col*spacing;
            const y = startY + row*spacing;

            const card = this.add.text(x, y, '', { fontSize:'64px', backgroundColor:'#ffeb3b', color:'#000', padding: {x:10,y:10}, align:'center' }).setOrigin(0.5).setInteractive();
            card.emoji = this.pairs[i];
            card.revealed = false;
            card.on('pointerdown', () => this.revealCard(card));
            this.cards.push(card);
        }

        this.firstCard = null;
        this.matches = 0;

        this.timerDuration = this.level===1 ? 60 : 90; // secondes
        this.timerText = this.add.text(50,50,'Time: '+this.timerDuration,{fontSize:'32px',color:'#000'}).setOrigin(0,0);
        this.scoreText = this.add.text(650,50,'Found: 0',{fontSize:'32px',color:'#000'}).setOrigin(0,0);

        this.timedEvent = this.time.addEvent({ delay:1000, callback:this.onTimer, callbackScope:this, loop:true });

        // son match
        this.matchSound = this.sound.add('match');
    }

    revealCard(card){
        if(card.revealed) return;
        card.setText(card.emoji);
        card.revealed = true;

        if(!this.firstCard){
            this.firstCard = card;
        } else {
            if(this.firstCard.emoji===card.emoji){
                // match
                this.matchSound.play();
                this.matches++;
                this.scoreText.setText('Found: '+this.matches);
                this.firstCard = null;
                if(this.matches===this.pairs.length/2){
                    this.time.delayedCall(1000, ()=>this.nextLevel(),[],this);
                }
            } else {
                // pas match
                const prev = this.firstCard;
                this.firstCard = null;
                this.time.delayedCall(500, ()=>{ card.setText(''); card.revealed=false; prev.setText(''); prev.revealed=false; },[],this);
            }
        }
    }

    onTimer(){
        this.timerDuration--;
        this.timerText.setText('Time: '+this.timerDuration);
        if(this.timerDuration<=0){
            this.timedEvent.remove(false);
            this.showRestart();
        }
    }

    showRestart(){
        const width = this.cameras.main.width;
        const height = this.cameras.main.height;
        this.add.rectangle(width/2,height/2,width,height,0x000000,0.5);
        const btn = this.add.dom(width/2,height/2).createFromHTML('<button class="btn">Start Again</button>');
        btn.addListener('click');
        btn.on('click', ()=>this.scene.start('MainMenu'));
    }

    nextLevel(){
        const width = this.cameras.main.width;
        const height = this.cameras.main.height;
        this.add.rectangle(width/2,height/2,width,height,0xffffff,0.8);
        this.add.text(width/2,height/2-50,'Félicitations ! Niveau 2 débloqué !',{fontSize:'32px',color:'#000'}).setOrigin(0.5);
        const btn = this.add.dom(width/2,height/2+50).createFromHTML('<button class="btn">Go to Level 2</button>');
        btn.addListener('click');
        btn.on('click', ()=>this.scene.start('GameScene',{level:2}));
    }
}

const config = {
    type: Phaser.AUTO,
    width: 800,
    height: 600,
    parent: 'phaser-example',
    scene: [BootScene, PreloaderScene, MainMenuScene, GameScene]
};

const game = new Phaser.Game(config);
</script>
</body>
</html>
