<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>🎮 Emoji Match 🎮</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.min.js"></script>
<style>
  body { margin: 0; background: #f0f8ff; display:flex; justify-content:center; align-items:center; height:100vh;}
  canvas { border: 2px solid #000; }
</style>
</head>
<body>

<script>
// -------------------------
// THEMES
// -------------------------
const THEMES = {
  emoji: ['😀','😎','😍','😂','🥰','😜','🤩','😇','😱','🤪','🤓','🤑','🥳','😏','🤠','🤖'],
  animals: ['🐶','🐱','🦁','🐯','🐭','🐹','🐰','🐻','🐼','🐨','🐸','🐵','🐔','🦊','🐴','🦄'],
  fruits: ['🍎','🍌','🍇','🍉','🍓','🍒','🍑','🍍','🥝','🥥','🍐','🍊','🥕','🍅','🥦','🌽'],
  sport: ['⚽','🏀','🏈','⚾','🎾','🏓','🏒','🥊','🎱','🤿','🥋','⛷️','🏄','🚴','⛳','🥅']
};

let selectedTheme = "emoji";
let nightMode = false;

// -------------------------
// Niveaux
// -------------------------
const levels = [
  { time: 60, pairs: 8 },
  { time: 90, pairs: 12 },
  { time: 120, pairs: 15 }
];

// -------------------------
// Boutons
// -------------------------
function createButton(scene, x, y, text, color, bgColor, callback, fontSize='28px'){
  const container = scene.add.container(x, y);
  const rect = scene.add.rectangle(0,0,250,60,bgColor,0.8).setStrokeStyle(3,0xFFFFFF);
  const btnText = scene.add.text(0,0,text,{fontSize,fontStyle:'bold',color}).setOrigin(0.5);
  container.add([rect,btnText]);
  container.setSize(rect.width, rect.height);
  container.setInteractive({useHandCursor:true})
           .on('pointerdown', ()=>{scene.sound.play('click'); callback();})
           .on('pointerover', ()=>scene.tweens.add({targets:container,scale:1.05,duration:150,yoyo:true}))
           .on('pointerout', ()=>container.setScale(1));
  return container;
}

// -------------------------
// Preload
// -------------------------
class PreloadScene extends Phaser.Scene {
  constructor(){ super('PreloadScene'); }
  preload(){
    this.load.audio('click','https://actions.google.com/sounds/v1/cartoon/wood_plank_flicks.ogg');
    this.load.audio('match','https://actions.google.com/sounds/v1/cartoon/pop.ogg');
    this.load.audio('bgMusic','https://wafa258.github.io/cv/xmas.mp3');
  }
  create(){ this.scene.start('MainMenu'); }
}

// -------------------------
// MENU
// -------------------------
class MainMenu extends Phaser.Scene {
  constructor(){ super('MainMenu'); }

  create(){
    this.add.rectangle(450,300,900,600,0xE800F0);
    this.add.text(450,100,'🎮 Emoji Match 🎮',{fontSize:'36px',color:'#FFF',fontStyle:'bold'}).setOrigin(0.5);
    this.add.text(450,160,'Choose your theme :',{fontSize:'28px',color:'#FFF'}).setOrigin(0.5);

    this.themeButtons = [];

    const selectTheme = (theme, btn) => {
      selectedTheme = theme;
      this.themeButtons.forEach(b => b.getAt(0).setFillStyle(0xF2509B));
      btn.getAt(0).setFillStyle(0xFF99CC);
      this.sound.play('click');
    };

    const b1 = createButton(this,250,230,'Emoji 😎','#FFF',0xF2509B,()=>selectTheme('emoji',b1));
    const b2 = createButton(this,650,230,'Animaux 🐶','#FFF',0xF2509B,()=>selectTheme('animals',b2));
    const b3 = createButton(this,250,320,'Fruits 🍎','#FFF',0xF2509B,()=>selectTheme('fruits',b3));
    const b4 = createButton(this,650,320,'Sport ⚽','#FFF',0xF2509B,()=>selectTheme('sport',b4));

    this.themeButtons.push(b1,b2,b3,b4);
    selectTheme('emoji', b1);

    createButton(this,450,450,'Start Level 1','#FFF',0xF2509B,()=>{
      this.scene.start('MainGame',{level:1, theme:selectedTheme});
    });
  }
}

// -------------------------
// TRANSITION
// -------------------------
class LevelTransition extends Phaser.Scene {
  constructor(){ super('LevelTransition'); }
  init(data){ this.nextLevel = data.level; }
  create(){
    this.add.rectangle(450,300,900,600,0xEA5EF2);
    this.add.text(450,180,'Félicitations 🥳',{fontSize:'44px',color:'#FF4500',fontStyle:'bold'}).setOrigin(0.5);
    this.add.text(450,250,'Jouez au niveau '+this.nextLevel,{fontSize:'28px',color:'#000',fontStyle:'bold'}).setOrigin(0.5);
    createButton(this,450,350,'Level '+this.nextLevel,'#FFF',0xFF6347,()=>{
      this.scene.start('MainGame',{level:this.nextLevel, theme:selectedTheme});
    });
  }
}

// -------------------------
// JEU
// -------------------------
class MainGame extends Phaser.Scene {
  constructor(){ super('MainGame'); }
  init(data){ this.level=data.level; this.theme=data.theme; }

  create(){
    const bgColors={emoji:0xDDB8F2,animals:0xA8E6CF,fruits:0xFFD3B6,sport:0xFFAAA5};
    this.background=this.add.rectangle(450,300,900,600,bgColors[this.theme]);

    const levelData=levels[this.level-1];
    this.timeLeft=levelData.time;
    this.pairs=levelData.pairs;
    this.score=0;
    this.matched=0;
    this.selected=null;

    this.timerText=this.add.text(20,20,'⏳ Time: '+this.timeLeft,{fontSize:'36px',color:'#333',fontStyle:'bold'});
    this.scoreText=this.add.text(700,20,'Found: '+this.score,{fontSize:'36px',color:'#333',fontStyle:'bold'});

    this.clignotementTween = null;

    // Icônes
    this.moonIcon=this.add.text(850,80,'🌙',{fontSize:'40px'}).setOrigin(0.5).setInteractive();
    this.moonIcon.on('pointerdown',()=>{ nightMode=!nightMode; this.updateNightMode(); this.sound.play('click'); });

    this.musicIcon=this.add.text(850,550,'🔊',{fontSize:'40px'}).setOrigin(0.5).setInteractive();
    this.musicIcon.on('pointerdown',()=>{
      this.sound.unlock();
      this.sound.play('click');
      if(!this.game.bgMusic){
        this.game.bgMusic=this.sound.add('bgMusic',{loop:true,volume:0.4});
        this.game.bgMusic.play();
      } else {
        this.game.bgMusic.isPlaying?this.game.bgMusic.pause():this.game.bgMusic.resume();
      }
    });

    this.pauseText=this.add.text(50,550,'⏸️',{fontSize:'40px',color:'#F2509B'}).setOrigin(0.5).setInteractive();
    this.pauseText.on('pointerdown',()=>{
      this.sound.play('click');
      this.scene.pause();
      this.scene.launch('PauseScene',{parent:this});
    });

    // Cartes
    this.cards=[];
    const emojis=THEMES[this.theme];
    let cardEmojis=[];
    for(let i=0;i<this.pairs;i++){
      cardEmojis.push(emojis[i%emojis.length],emojis[i%emojis.length]);
    }
    Phaser.Utils.Array.Shuffle(cardEmojis);

    const cols=this.level===1?4:5;
    const startX=(900-(cols-1)*100)/2;
    const startY=160;

    cardEmojis.forEach((e,i)=>{
      const card=this.add.text(
        startX+(i%cols)*100,
        startY+Math.floor(i/cols)*100,
        '❓',{fontSize:'64px'}
      ).setOrigin(0.5).setInteractive();

      card.emoji=e;
      card.revealed=false;
      card.on('pointerdown',()=>this.flipCard(card));
      this.cards.push(card);
    });

    // TIMER avec clignotement
    this.timerEvent=this.time.addEvent({
      delay:1000,
      loop:true,
      callback:()=>{
        this.timeLeft--;
        this.timerText.setText('⏳ Time: '+this.timeLeft);

        if(this.timeLeft===10){
          this.timerText.setColor('#FF0000');
          this.clignotementTween=this.tweens.add({
            targets:this.timerText,
            alpha:0,
            duration:250,
            yoyo:true,
            repeat:-1
          });
        }

        if(this.timeLeft<=0) this.endGame();
      }
    });
  }

  updateNightMode(){
    if(nightMode){
      this.background.setFillStyle(0x0D1B2A);
      this.cards.forEach(c=>c.setColor('#0ff'));
      this.timerText.setColor('#0ff');
      this.scoreText.setColor('#0ff');
    } else {
      const bgColors={emoji:0xDDB8F2,animals:0xA8E6CF,fruits:0xFFD3B6,sport:0xFFAAA5};
      this.background.setFillStyle(bgColors[this.theme]);
      this.cards.forEach(c=>c.setColor('#000'));
      this.timerText.setColor('#333');
      this.scoreText.setColor('#333');
    }
  }

  flipCard(card){
    if(card.revealed||this.selected===card) return;
    card.setText(card.emoji);
    card.revealed=true;

    if(!this.selected){
      this.selected=card;
    } else {
      if(this.selected.emoji===card.emoji){
        this.matched++;
        this.score++;
        this.scoreText.setText('Found: '+this.score);
        this.sound.play('match');

        // Animation de récompense
        this.tweens.add({
          targets:[card,this.selected],
          scale:1.3,
          duration:200,
          yoyo:true,
          onComplete:()=>{card.setScale(1); this.selected.setScale(1);}
        });

        this.selected=null;
        if(this.matched===this.cards.length/2){
          this.level<levels.length
            ? this.scene.start('LevelTransition',{level:this.level+1})
            : this.endGame(true);
        }
      } else {
        const first=this.selected;
        this.selected=null;
        this.time.delayedCall(700,()=>{
          first.setText('❓'); first.revealed=false;
          card.setText('❓'); card.revealed=false;
          this.sound.play('click');
        });
      }
    }
  }

  endGame(win=false){
    if(this.clignotementTween) this.clignotementTween.stop();
    this.timerEvent.remove();

    this.add.rectangle(450,300,900,600,0x000000,0.5);
    this.add.text(450,200,win?'Level Complete!':'Time Over!',
      {fontSize:'44px',color:'#FFF',fontStyle:'bold'}).setOrigin(0.5);

    createButton(this,450,300,'Restart','#FFF',0xFF6347,()=>this.scene.start('MainMenu'));
  }
}

// -------------------------
class PauseScene extends Phaser.Scene{
  constructor(){ super('PauseScene'); }
  init(data){ this.parent=data.parent; }
  create(){
    this.add.rectangle(450,300,900,600,0x000000,0.5);
    this.add.text(450,180,'Paused',{fontSize:'44px',color:'#FFF',fontStyle:'bold'}).setOrigin(0.5);
    createButton(this,450,300,'▶ Resume','#FFF',0xF2509B,()=>{
      this.scene.stop();
      this.parent.scene.resume();
    },'32px');
  }
}

const config={type:Phaser.AUTO,width:900,height:600,scene:[PreloadScene,MainMenu,LevelTransition,MainGame,PauseScene]};
new Phaser.Game(config);
</script>

</body>
</html>
