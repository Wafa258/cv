<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <title>Emoji Match - Phaser</title>

    <!-- Charger Phaser -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.85.0/dist/phaser.min.js"></script>

    <style>
        body {
            margin: 0;
            background: #000;
        }
        canvas {
            display: block;
            margin: auto;
        }
    </style>
</head>
<body>

<script>
// -------------------------------
// CODE DU JEU EMOJI MATCH
// -------------------------------

const COLOR_PRIMARY = 0x4e342e;
const COLOR_LIGHT = 0x7b5e57;
const COLOR_DARK = 0x260e04;

class Demo extends Phaser.Scene {
    constructor() {
        super({ key: 'examples' });
    }

    preload() {
        this.load.scenePlugin(
            'rexmatchingsplashplugin',
            'https://raw.githubusercontent.com/rexrainbow/phaser3-rex-notes/master/dist/rexmatchingsplashplugin.min.js',
            'matchingsplash',
            'matchingsplash'
        );
    }

    create() {
        const splash = this.add.rexMatchingsplash({
            x: 300,
            y: 320,
            columns: 6,
            rows: 6,
            images: [
                '😀', '😁', '😂', '🤣', '😃', '😄',
                '😅', '😆', '😉', '😊', '😋', '😎'
            ],
            borderColor: COLOR_PRIMARY,
            borderWidth: 4,
            imageSize: 80,
            animationSpeed: 150,
            matchLength: 3
        });

        splash.on('score', (score) => {
            console.log("Score:", score);
        });
    }
}

var config = {
    type: Phaser.AUTO,
    width: 600,
    height: 640,
    backgroundColor: '#222222',
    scene: Demo
};

var game = new Phaser.Game(config);

</script>

</body>
</html>
