<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Emoji Match - Multi-Level Amélioré</title>
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #ff9a9e, #fad0c4, #a1c4fd);
  display: flex;
  flex-direction: column;
  align-items: center;
}
h1 {
  color: #333;
  margin-top: 20px;
  text-align: center;
  text-shadow: 2px 2px #fff7;
}
#game-container {
  margin-top: 20px;
}

/* Boutons modernes */
.phaser-btn {
  padding: 14px 28px;
  font-size: 22px;
  margin-top: 20px;
  cursor: pointer;
  border: none;
  border-radius: 20px;
  background: linear-gradient(45deg, #ffafbd, #ffc3a0);
  color: #fff;
  font-weight: bold;
  box-shadow: 0 6px 20px rgba(0,0,0,0.3);
  transition: transform 0.2s, box-shadow 0.2s;
}
.phaser-btn:hover {
  transform: translateY(-4px);
  box-shadow: 0 10px 25px rgba(0,0,0,0.4);
}

/* Cadre des cartes */
.card-frame {
  background-color: #fff0; /* transparent pour fond */
  padding: 10px;
  border-radius: 12px;
  border: 3px solid #ffd700; /* couleur joyeuse dorée */
}
</style>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.min.js"></script>
</head>
<body>
<h1>🎉 Emoji Match Multi-Level 🎉</h1>
<div id="game-container"></div>

<script>
let config = {
    type: Phaser.AUTO,
    width: 800,
    height: 600,
    parent: 'game-container',
    scene: { preload, create, update }
};

let game = new Phaser.Game(config);

let cards = [], firstCard = null, canClick = true;
let matches = 0, scoreText, timerText;
let timerEvent;
let level = 1;
let emojis = ['😀','😎','🎯','🎲','🕹️','🤖','🐶','🍕','🍔','🌈','⭐','🍩','⚡','💎','🎵','🍉'];
let gridConfig = {1:{cols:4, rows:4, time:60}, 2:{cols:5, rows:4, time:90}};
let totalPairs;

function preload(){}

function create() {
    startLevel(this, level);
}

function startLevel(scene, lvl){
    scene.children.removeAll();
    cards=[]; firstCard=null; matches=0; canClick=true;

    let cols = gridConfig[lvl].cols;
    let rows = gridConfig[lvl].rows;
    let levelTime = gridConfig[lvl].time;
    totalPairs = Math.min(emojis.length, Math.floor(cols*rows/2));

    scoreText = scene.add.text(20,20,'Found: 0',{fontSize:'28px',color:'#333'});
    timerText = scene.add.text(650,20,levelTime,{fontSize:'28px',color:'#333'});

    // Timer
    timerEvent = scene.time.addEvent({delay:levelTime*1000, callback:timeOver, callbackScope:scene});

    // Prepare deck
    let deck = emojis.slice(0,totalPairs);
    deck = [...deck,...deck];
    Phaser.Utils.Array.Shuffle(deck);

    let spacingX = 120, spacingY = 120;
    let startX = (800 - spacingX*cols)/2 + spacingX/2;
    let startY = 120;

    for(let i=0;i<cols*rows;i++){
        let x = startX + (i%cols)*spacingX;
        let y = startY + Math.floor(i/cols)*spacingY;
        let card = scene.add.text(x,y,'❓',{fontSize:'64px',align:'center',padding:{x:10,y:10},backgroundColor:'#fff0',style:{border:'3px solid #ffd700',borderRadius:'12px'}}).setOrigin(0.5).setInteractive();
        card.emoji = deck[i];
        card.revealed = false;

        let circle = scene.add.circle(x,y,45,0xffff00,0).setStrokeStyle(3,0xff69b4); // contour rose
        circle.setVisible(false);
        card.circle = circle;

        cards.push(card);
    }

    scene.input.on('gameobjectdown', function(pointer, card){
        if(!canClick || card.revealed) return;
        revealCard(card);
    });
}

function revealCard(card){
    card.setText(card.emoji);
    card.revealed = true;
    card.circle.setVisible(true);

    if(!firstCard){
        firstCard = card;
    } else {
        canClick=false;
        if(firstCard.emoji === card.emoji){
            beepGood();
            matches++;
            scoreText.setText('Found: '+matches);
            firstCard.circle.setStrokeStyle(3,0x00ff00);
            card.circle.setStrokeStyle(3,0x00ff00);
            setTimeout(()=>{firstCard=null; canClick=true; checkLevelComplete();},500);
        } else {
            beepBad();
            setTimeout(()=>{
                firstCard.setText('❓'); firstCard.revealed=false; firstCard.circle.setVisible(false);
                card.setText('❓'); card.revealed=false; card.circle.setVisible(false);
                firstCard=null; canClick=true;
            },600);
        }
    }
}

function update(){
    if(timerEvent){
        let remaining = (timerEvent.delay - timerEvent.getElapsed())/1000;
        remaining = Math.ceil(remaining);
        timerText.setText(remaining.toString().padStart(2,'0'));
    }
}

function timeOver(){
    let scene = game.scene.scenes[0];
    canClick=false;
    let btn = scene.add.text(400,550,'Start Again',{fontSize:'28px',color:'#fff',backgroundColor:'#ff6b6b',padding:{x:20,y:12}}).setOrigin(0.5).setInteractive();
    btn.setData('class','phaser-btn');
    btn.on('pointerdown',()=>startLevel(scene,level));
}

function checkLevelComplete(){
    if(matches >= totalPairs){
        let scene = game.scene.scenes[0];
        canClick=false;
        if(level<2){
            let btn = scene.add.text(400,550,'Next Level',{fontSize:'28px',color:'#fff',backgroundColor:'#ff6b6b',padding:{x:20,y:12}}).setOrigin(0.5).setInteractive();
            btn.setData('class','phaser-btn');
            btn.on('pointerdown',()=>{
                level++;
                startLevel(scene,level);
            });
        } else {
            let btn = scene.add.text(400,550,'You Won! Restart',{fontSize:'28px',color:'#fff',backgroundColor:'#ff6b6b',padding:{x:20,y:12}}).setOrigin(0.5).setInteractive();
            btn.setData('class','phaser-btn');
            btn.on('pointerdown',()=>startLevel(scene,level));
        }
    }
}

// Sons Web Audio
function beepGood(){
    let ctx = new (window.AudioContext||window.webkitAudioContext)();
    let o = ctx.createOscillator();
    let g = ctx.createGain();
    o.type='square';
    o.frequency.setValueAtTime(600,ctx.currentTime);
    o.connect(g); g.connect(ctx.destination);
    o.start(0); g.gain.exponentialRampToValueAtTime(0.00001, ctx.currentTime+0.1);
}

function beepBad(){
    let ctx = new (window.AudioContext||window.webkitAudioContext)();
    let o = ctx.createOscillator();
    let g = ctx.createGain();
    o.type='square';
    o.frequency.setValueAtTime(200,ctx.currentTime);
    o.connect(g); g.connect(ctx.destination);
    o.start(0); g.gain.exponentialRampToValueAtTime(0.00001, ctx.currentTime+0.2);
}
</script>
</body>
</html>
